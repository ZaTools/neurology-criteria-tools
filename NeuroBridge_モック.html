<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- セキュリティ対策(CSP): このアプリは外部通信を一切行わない単一HTMLファイルのため、
     既定を'none'にしたうえで必要な例外のみ許可しています。
     script-src/style-styleに'unsafe-inline'が必要な理由: ビルド工程がなく、
     onclick=""属性とインラインの<style>を多用しているため（nonce方式は使えない）。
     ※ SAVE_ENDPOINT を設定して外部保存機能を使う場合は、下の connect-src に
        その保存先のオリジンを追加してください（現状は空欄なので'none'）。
     ※ frame-ancestors（他サイトのiframeに埋め込まれるのを防ぐ＝クリックジャッキング対策）は
        <meta>では効かない仕様のため、実際にWeb公開する際はホスティング側の設定
        （HTTPレスポンスヘッダーの Content-Security-Policy か X-Frame-Options: DENY）で
        別途かけること。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>NeuroBridge — 症状メモ（モック）</title>
<script id="qrlib">//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode

<script>
/* ===== 状態（画面内メモリのみ・保存しない） ===== */
const D = { who:null, ageBand:null, symptoms:[], mods:[], common:{}, m:{1:{},2:{},3:{}},
            assoc:{}, func:[], daily:[], dailyNone:{}, vis:{}, sx:{},
            bg:{risk:[],med:null,medText:"",family:null,immune:[],lifestyle:[],exposure:[],allergy:"",history:"",
                autonomic:[],dopaDrug:null,preInfection:null,pregnancy:null},
            visited:[], tests:"", free:"" };
/* ============================================================================
   ▼▼▼ ここから【設定ブロック】：質問文と選択肢はすべてこの範囲にあります ▼▼▼
   文言の調整はここだけを見ればできます。中身の一覧：
     ONSET_OPTS(発症時期) / SEV_OPTS(つらさ) / TREND_OPTS(その後の変化)
     EVENT_TAGS(悪くなった時の出来事) / AGES(年代) / VISITED(受診した科)
     WHO(入力者) / SYMPTOMS(気になる症状) / COMMON(全体の様子=時間軸)
     ASSOC_GROUPS(一緒に出ている症状) / FUNC(機能への影響) / DAILY_GROUPS(ふだんの困りごと)
     QM(症候別モジュール①②③) / BG_*(背景) / OPT_*(その他の単発の選択肢)
     AGGRAV_TAGS・RELIEF_TAGS(悪化/軽減のきっかけ)

   ★編集するときの注意★
   ・選択肢の文言を変えると、その回答を使っている判定
     （syndromePatterns / redFlags / unconfirmedItems / buildSummaryParts）も
     あわせて直す必要があります。文言が判定の目印を兼ねているためです。
   ・引き継ぎQRは選択肢の「並び順」を番号として使っています。順番を入れ替えたり
     途中に項目を足すと古いQRと意味がずれますが、SCHEMA_SIG が自動で変化して
     古いQRは「読み込めません」と安全に弾かれるので、番号の付け替えは不要です。
   ============================================================================ */
/* 症状ごとの経過（時系列グラフ用）：発症時期バケット・程度・変化の向き */
const ONSET_OPTS=[["今日",0.03],["数日前",0.15],["1〜2週間前",0.4],["1か月前",1],
  ["2〜3か月前",2.5],["半年前",6],["1年前",12],["2年以上前",30],["わからない",null]];
const SEV_OPTS=["軽い","中くらい","重い"];
const TREND_OPTS=["だんだん強くなる","出たり治ったり（波がある）","変わらない","軽くなってきた"];
/* 悪くなった時の「できごと」の目印（病名・診断には触れない、機能的な出来事のみ） */
const EVENT_TAGS=["転倒した","杖・歩行器を使い始めた","車椅子になった","入院した","急に強くなった","動けなくなった","一人でできなくなった","その他"];
/* 症状ごとの色分け（カテゴリカル配色・固定順。色だけに頼らず凡例とラベルを併用） */
const SYMPTOM_COLORS=["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#4a3aa7","#e34948"];
function symptomColor(s){const i=D.symptoms.indexOf(s);return (i>=0&&i<SYMPTOM_COLORS.length)?SYMPTOM_COLORS[i]:"#898781";}
function eventMonths(e){const f=ONSET_OPTS.find(x=>x[0]===e.bucket);return f?f[1]:null;}
let EVUI={}; /* 出来事フォームの一時状態（画面内メモリのみ・保存しない） */
function sxMonths(s){const o=D.sx[s]&&D.sx[s].onset;const f=ONSET_OPTS.find(x=>x[0]===o);return f?f[1]:null;}
/* 今回の受診理由（急に悪くなった時期）の月数。グラフに目印を出す */
function visitMonths(){const f=ONSET_OPTS.find(x=>x[0]===D.common.visitBucket);return f?f[1]:null;}
function setVisit(o){D.common.visitBucket=(D.common.visitBucket===o?null:o);render();}
/* 最も古い症状の発症ラベル（全体の発症時期として利用） */
function overallOnset(){let best=null,lab=null;D.symptoms.forEach(s=>{const m=sxMonths(s);if(m!=null&&(best==null||m>best)){best=m;lab=D.sx[s].onset;}});return lab;}
const AGES = ["〜39","40代","50代","60代","70代","80代","90歳〜","答えない"];
const VISITED = ["かかりつけ医","脳神経外科","眼科","整形外科","耳鼻科","リハビリ","救急","未受診"];

/* ===== データ保存（任意・研究/改善用） =====
   SAVE_ENDPOINT に保存先URL（Google Apps Script など）を入れると、
   利用者が同意した場合のみ完了時に送信します。空のままなら保存機能はオフ。 */
const SAVE_ENDPOINT = ""; // ←ここに公開したWebアプリのURLを貼る（※設定したら<head>のCSPのconnect-srcにもこのURLのオリジンを追加すること）
const SESSION = { id:"NBG-"+nowStr().slice(2).replace(/-/g,"")+"-"+Math.floor(1000+Math.random()*9000), start:Date.now() };
let _saved=false;
/* 保存対象は「選択式の回答」のみ。自由記述（free/tests/medText/trouble/編集後文）は送信しない */
function buildPayload(){
  const c=D.common;
  return {
    sessionId:SESSION.id,

function unconfirmedItems(){
  const out=[];const A=D.assoc;const miss=n=>!A[n]||A[n]==="u";
  if(D.mods.includes(3)||D.symptoms.includes("ものが二重に見える")||D.symptoms.includes("まぶたが下がる")){
    if(miss("飲み込みにくさ・むせ")||miss("ろれつが回りにくい")||miss("息苦しさ"))
      out.push("飲み込みにくさ・ろれつ・息苦しさの有無を確認するとよいかもしれません");
  }
  if(D.mods.includes(1)){
    if(!D.m[1].falldir||!D.common.tempo)
      out.push("転び方・進み方・尿のトラブルの有無を確認するとよいかもしれません");
  }
  if(D.mods.includes(2)){
    if(!D.m[2].prox||!D.common.side||miss("飲み込みにくさ・むせ")||miss("ろれつが回りにくい")||miss("息苦しさ"))
      out.push("力の入る場所・左右差・飲み込み/ろれつ/息苦しさを確認するとよいかもしれません");
  }
  if(D.mods.includes(3)){
    if(!D.m[3].diurnal||D.m[3].diurnal==="わからない")
      out.push("症状の朝夕の変動・疲れによる悪化の有無を確認するとよいかもしれません");
  }
  if(D.common.tempo&&D.common.tempo.includes("くり返す")){
    if(!D.common.course)
      out.push("症状が出る頻度・持続時間・きっかけを確認するとよいかもしれません");
  }
  if(A["物忘れ・性格や行動の変化"]==="y")
    out.push("物忘れ・行動の変化について、いつ頃からか・日常生活への影響を確認するとよいかもしれません");
  if(D.bg.autonomic&&D.bg.autonomic.length&&!D.common.tempo)
    out.push("尿・立ちくらみ・便秘などの症状の経過・順序を確認するとよいかもしれません");
  // 複数領域に症状が及ぶ場合：過去の似たエピソードの有無（順序・時系列の手がかり）
  const dGroups=DAILY_GROUPS.filter(g=>dSel(g).length).length;
  if(dGroups>=2||D.symptoms.length>=3)
    out.push("以前にも似た症状が出て自然に良くなったこと（出たり治ったり）がなかったかを確認するとよいかもしれません");
  const aggrGiven=(D.common.aggravTags&&D.common.aggravTags.length)||D.common.aggrav;
  if(!aggrGiven)
    out.push("悪くなる・楽になるきっかけ（疲れ・時間帯・暑さ・入浴・姿勢など）を確認するとよいかもしれません");
  if((D.daily.includes("vis")||D.symptoms.includes("視力が落ちた・目が痛い"))&&!D.vis.note&&!D.vis.side)
    out.push("目の症状について、片目か両目か・いつからか・見え方の変化を確認するとよいかもしれません");
  if(D.common.tempo&&(D.common.tempo.includes("くり返す")||D.common.tempo.includes("落ち着いた"))&&!D.common.episodeDur)
    out.push("症状が1回どれくらい続くか（持続時間）を確認するとよいかもしれません");
  if(!D.common.tempo) out.push("発症が突然か・徐々にか・くり返すかを確認するとよいかもしれません");
  if(!overallOnset()&&!D.common.onsetMonth&&!D.common.onsetDate)
    out.push("それぞれの症状がいつから始まったか（おおよその時期・順序）を確認するとよいかもしれません");
  /* 仕様§5: 提示は最大5件（症候特異的ルールを優先。配列前方＝症候別が先に入る構成） */
  return out.slice(0,5);
}

const app=document.getElementById("app");

let _lastPhase=null,_lastMod=null;
function render(){
  let h="";
  const fn={intro:scrIntro,who:scrWho,symptoms:scrSymptoms,sxtime:scrSxtime,common:scrCommon,module:scrModule,
    assoc:scrAssoc,daily:scrDaily,bg:scrBg,free:scrFree,confirm:scrConfirm,output:scrOutput}[phase];
  h=fn();
  // 画面（フェーズ／モジュール）が変わったときだけ先頭へ。同じ画面内の操作はスクロール位置を保持
  const screenChanged=(phase!==_lastPhase)||(phase==="module"&&modCursor!==_lastMod);
  const sy=window.scrollY;
  app.innerHTML=h; drawStepper(); updateNav();
  if(phase==="sxtime"||phase==="output")attachWaveHandlers();
  syncHistory();
  applyOneQ(screenChanged);
  if(screenChanged)autoRead();
  window.scrollTo(0,screenChanged?0:sy);
  _lastPhase=phase; _lastMod=modCursor;
}

function drawStepper(){
  const idx=STEPS.findIndex(s=>s[0]===phase);const finished=phase==="output";
  const ms=document.getElementById("mstep");
  if(phase==="intro"){ms.innerHTML="";}
  else if(finished){ms.innerHTML=`<div class="seg">${STEPS.map(()=>'<i class="done"></i>').join("")}</div><div class="lab">✓ 完成しました</div>`;}
  else {ms.innerHTML=`<div class="seg">${STEPS.map((s,i)=>`<i class="${i<idx?'done':i===idx?'cur':''}"></i>`).join("")}</div>
    <div class="lab">ステップ ${idx+1} / ${STEPS.length}　・　${STEPS[idx][1]}</div>`;}
  const ds=document.getElementById("dstep");
  ds.innerHTML=STEPS.map((s,i)=>{
    let cls=finished?"done":(i<idx?"done":i===idx?"cur":"");
    const mark=(cls==="done")?"✓":(i+1);
    return `<div class="it ${cls}"><span class="c">${mark}</span>${s[1]}</div>`;
  }).join("");
}

/* === 症状ごとの経過（時系列）：選んだ症状それぞれの「いつから・程度・変化」 === */
let SX_OPEN=null;   /* いま開いている症状。null なら「最初の未入力」を自動で開く */
function sxDone(s){const r=D.sx[s]||{};return !!(r.onset&&r.sev&&r.trend);}
function firstOpenSx(){return D.symptoms.find(x=>!sxDone(x))||D.symptoms[0]||null;}
function toggleSxOpen(s){SX_OPEN=(SX_OPEN===s?"__none__":s);render();}
function sxSummaryLine(s){const r=D.sx[s]||{};
  const parts=[r.onset,r.sev&&("つらさ"+r.sev),r.trend].filter(Boolean);
  return parts.length?parts.join(" / "):"まだ入力していません";}
function noteBanner(){return RESTORE_NOTE?`<div class="note" style="background:var(--brand-l);border-color:var(--brand);color:var(--brand-d)">🔁 ${RESTORE_NOTE}</div>`:"";}
function scrSxtime(){
  let h=proxyBanner()+noteBanner()+`<div class="qhead"><span class="qnum">🕒</span><span class="qtext">選んだ症状は、それぞれいつ頃からですか？</span>${spkBtn("選んだ症状は、それぞれいつ頃からですか？だいたいで大丈夫です")}</div>
   <div class="hint">順番や時期がわかると、経過がグラフになります。だいたいで大丈夫です。</div>`;
  h+=overviewChart();
  const openSx=(SX_OPEN==="__none__")?null:(SX_OPEN||firstOpenSx());
  if(D.symptoms.length>1){
    const done=D.symptoms.filter(sxDone).length;
    h+=`<div class="mini" style="margin:8px 0 2px">症状ごとに入力します（${done} / ${D.symptoms.length} 件おわり）。答え終わった症状は1行にたたまれます。</div>`;
  }
  D.symptoms.forEach(s=>{
    const r=D.sx[s]||{},col=symptomColor(s),esq=s.replace(/'/g,"");
    if(s!==openSx){
      /* たたんだ状態：1行の要約＋タップで開く */
      h+=`<button type="button" onclick="toggleSxOpen('${esq}')" style="width:100%;text-align:left;display:flex;align-items:center;gap:10px;
        border:1px solid var(--line);border-left:5px solid ${col};border-radius:12px;padding:12px 14px;margin:8px 0;background:#fff;cursor:pointer;font-family:inherit;min-height:52px">
        <span style="flex:0 0 auto;font-size:16px">${sxDone(s)?"✓":"…"}</span>
        <span style="flex:1 1 auto;min-width:0">
          <span style="display:block;font-weight:800;color:var(--brand-d);font-size:calc(15px*var(--fs))">${esc(s)}</span>
          <span style="display:block;color:var(--sub);font-size:calc(13px*var(--fs))">${esc(sxSummaryLine(s))}</span>
        </span>
        <span style="flex:0 0 auto;color:var(--brand-d);font-weight:800">${sxDone(s)?"直す":"入力する"} ▸</span></button>`;
      return;
    }
    h+=`<div class="qunit" style="border:1px solid var(--line);border-left:5px solid ${col};border-radius:14px;padding:12px 14px;margin:12px 0;background:#fcfdff">
      <div style="font-weight:800;color:var(--brand-d);margin-bottom:6px">${esc(s)}</div>
      <div class="hint" style="margin:2px 0 4px">いつ頃から</div>
      <div class="opts grid">`+ONSET_OPTS.map(([o])=>opt(r.onset===o,o,`setSx('${esq}','onset','${o.replace(/'/g,"")}')`)).join("")+`</div>
      <div class="hint" style="margin:8px 0 4px">今のつらさ${prevOf(s)&&prevOf(s).sev?`<span style="color:var(--brand-d);font-weight:700">（前回は「${esc(prevOf(s).sev)}」）</span>`:""}</div>
      <div class="opts grid">`+SEV_OPTS.map(o=>opt(r.sev===o,o,`setSx('${esq}','sev','${o}')`)).join("")+`</div>
      <div class="hint" style="margin:8px 0 4px">その後の変化</div>
      <div class="opts grid">`+TREND_OPTS.map(o=>opt(r.trend===o,o,`setSx('${esq}','trend','${o.replace(/'/g,"")}')`)).join("")+`</div>
      ${eventBlock(s)}
    </div>`;
  });
  h+=qhead("📣","今回、受診しようと思うほど悪くなったのはいつ頃ですか？","（任意）グラフに赤い目印を付けます");
  h+=`<div class="opts grid">`+ONSET_OPTS.filter(o=>o[0]!=="わからない").map(([o])=>opt(D.common.visitBucket===o,o,`setVisit('${o.replace(/'/g,"")}')`)).join("")+`</div>`;
  h+=`<div class="hint" style="margin-top:6px">📅 最初の症状の正確な日付がわかれば（任意）</div>`;
  h+=dateBlock("onset","最初に何か症状が出た時期");
  h+=trajectoryChart(true);
  return card(h);}
function setSx(s,k,v){D.sx[s]=D.sx[s]||{};D.sx[s][k]=(D.sx[s][k]===v?null:v);
  /* 3つ答え終わったら次の未入力へ自動で送る（送り忘れを防ぐ） */
  if(sxDone(s)&&(SX_OPEN===s||SX_OPEN===null)){const nx=D.symptoms.find(x=>!sxDone(x));SX_OPEN=nx||"__none__";}
  render();}

/* できごと（悪くなった時期の目印）：症状ごとに複数追加できる。病名・診断には触れない */
function eventBlock(s){
  const evs=(D.sx[s]&&D.sx[s].events)||[];
  const ui=EVUI[s]||{};
  let h=`<div class="hint" style="margin:10px 0 4px">📌 悪くなった時の出来事（あれば）</div>`;

function toggleEvUI(s){EVUI[s]=EVUI[s]||{};EVUI[s].open=!EVUI[s].open;render();}
function setEvBucket(s,b){EVUI[s]=EVUI[s]||{};EVUI[s].bucket=(EVUI[s].bucket===b?null:b);render();}
function setEvTag(s,t){EVUI[s]=EVUI[s]||{};EVUI[s].tag=(EVUI[s].tag===t?null:t);render();}
function setEvNote(s,v){EVUI[s]=EVUI[s]||{};EVUI[s].note=v;}
function addEvent(s){const u=EVUI[s];if(!u||!u.bucket||!u.tag)return;

/* 症状ごとの推移カーブ。問診の「程度・その後の変化」から初期の線をつくり、
   指で丸を上下に動かして各時期の「つらさ」の“ゆらぎ”を表現できる（自己完結SVG）。 */
const WAVE_N=7;
let WAVE_EDIT=false; /* ドラッグ編集は任意の上級機能（既定OFF。選択式回答から自動で線を生成） */
let WAVE_TARGET=0;    /* 調整中に対象としている症状（rows内の位置） */
function setWaveTarget(i){WAVE_TARGET=i;render();}
/* 横軸の目盛りラベル。1か月未満は日単位で出す（従来は「0か月前」になっていた） */
function tickLabel(m){
  if(m<0.02)return "今";
  if(m<0.9)return `${Math.max(1,Math.round(m*30))}日前`;
  if(m<12)return `${Math.round(m)}か月前`;
  return `${Math.round(m/12)}年前`;
}
function waveArr(s){
  const r=D.sx[s]||{};
  if(r.wave&&r.wave.length===WAVE_N)return r.wave;
  const sev=r.sev,tr=r.trend;
  const base=sev==="重い"?0.85:sev==="中くらい"?0.6:sev==="軽い"?0.4:0.55;
  const a=[];
  for(let i=0;i<WAVE_N;i++){const t=i/(WAVE_N-1);let v;
    if(tr==="だんだん強くなる")v=0.3+0.6*t;
    else if(tr==="軽くなってきた")v=0.9-0.6*t;
    else if(tr&&tr.indexOf("出たり")>=0)v=base+0.3*Math.sin(t*Math.PI*2.4);
    else v=base;
    a.push(Math.max(0.12,Math.min(1,v)));}
  return a;
}
/* 俯瞰グラフ：選んだ全ての症状を1つの軸に重ねて色分け表示（比較用）。
   症状が2つ以上あるときだけ意味があるので、1つ以下なら何も出さない。 */
function overviewChart(){

  const W=560,padL=20,padR=20,padT=22,padB=34,H=230;

  const now=x(0);

  const ticks=[maxM,maxM/2,0].map(m=>{const lb=tickLabel(m);
    return `<line x1="${x(m)}" y1="${yTop-6}" x2="${x(m)}" y2="${yBot}" stroke="#eef2f7"/>
      <text x="${x(m)}" y="${H-14}" text-anchor="middle" font-size="12" fill="#71828f">${lb}</text>`;}).join("");
  const nowLine=`<line x1="${now}" y1="${yTop-6}" x2="${now}" y2="${yBot}" stroke="var(--warn)" stroke-dasharray="3 3"/>
    <text x="${now}" y="${yTop-9}" text-anchor="middle" font-size="10" fill="var(--warn)">今</text>`;
  const vm=visitMonths();
  const visitLine=(vm!=null&&vm<=maxM+0.001)?`<line x1="${x(vm).toFixed(1)}" y1="${yTop-6}" x2="${x(vm).toFixed(1)}" y2="${yBot}" stroke="#c0392b" stroke-width="2"/>
    <text x="${x(vm).toFixed(1)}" y="${yTop-9}" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="700">受診理由</text>`:"";
  let body="",legendHtml="";const evAll=[];
  rows.forEach(r=>{
    const col=symptomColor(r.s);
    const x0=x(r.m);
    const xs=[];for(let i=0;i<WAVE_N;i++)xs.push(x0+(now-x0)*(i/(WAVE_N-1)));
    const wv=waveArr(r.s);
    const pts=xs.map((xx,i)=>`${xx.toFixed(1)},${yOf(wv[i]).toFixed(1)}`).join(" ");
    body+=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>`;
    body+=`<circle cx="${xs[xs.length-1].toFixed(1)}" cy="${yOf(wv[wv.length-1]).toFixed(1)}" r="4.5" fill="${col}"/>`;
    legendHtml+=`<span style="display:inline-flex;align-items:center;gap:6px;font-size:calc(13px*var(--fs));color:var(--ink);margin-right:14px">
      <span style="width:16px;height:4px;border-radius:2px;background:${col};display:inline-block"></span>${r.s}</span>`;
    ((D.sx[r.s]&&D.sx[r.s].events)||[]).forEach(e=>{const em=eventMonths(e);if(em==null)return;
      evAll.push({s:r.s,col,m:em,bucket:e.bucket,tag:e.tag,note:e.note});});
  });
  evAll.sort((a,b)=>b.m-a.m); /* 古い→新しい の順で番号を振る（レーン別詳細と同じ並び） */
  let evBody="",evFoot="";
  evAll.forEach((e,i)=>{if(e.m>maxM+0.001)return;const xe=x(e.m);const num=i+1;
    evBody+=`<line x1="${xe.toFixed(1)}" y1="${yTop}" x2="${xe.toFixed(1)}" y2="${yBot}" stroke="${e.col}" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
      <circle cx="${xe.toFixed(1)}" cy="${(yTop+10).toFixed(1)}" r="8" fill="#fff" stroke="${e.col}" stroke-width="2"/>
      <text x="${xe.toFixed(1)}" y="${(yTop+13.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="${e.col}">${num}</text>`;
    evFoot+=`<div style="display:flex;gap:7px;align-items:baseline;margin:2px 0;font-size:calc(12.5px*var(--fs))">
      <span style="flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid ${e.col};color:${e.col};font-weight:800;font-size:10px;display:inline-flex;align-items:center;justify-content:center">${num}</span>
      <span><b style="color:${e.col}">${esc(e.s)}</b>：${esc(e.bucket)}・${esc(e.tag)}${e.note?`（${esc(e.note)}）`:""}</span></div>`;});
  return `<div class="blk ovblk"><h4 style="color:var(--brand-d);margin:14px 0 4px">📊 症状の経過（全体の見え方・重ね合わせ）</h4>

      ${ticks}${nowLine}${visitLine}${evBody}${body}</svg>
    <div style="margin-top:6px">${legendHtml}</div>
    <div class="chartcap" style="font-size:calc(13px*var(--fs));color:var(--sub);margin-top:4px">縦＝つらさ（上ほど強い）／横＝時間（左が昔・右が今）。線の色は症状ごとです。</div>
    ${evFoot?`<div style="margin-top:8px"><div class="hint" style="margin:0 0 4px">📌 経過の目印</div>${evFoot}</div>`:""}
  </div>`;
}
function trajectoryChart(editable){
  const all=D.symptoms.map(s=>({s,m:sxMonths(s)})).filter(r=>r.m!=null);
  if(all.length<1)return editable?`<div class="note" style="margin-top:14px;background:#f5f9fd;border-color:var(--line);color:var(--sub)">時期を選ぶと、ここに症状の推移グラフが表示されます。</div>`:"";
  all.sort((a,b)=>b.m-a.m);
  const editing=!!(editable&&WAVE_EDIT);
  if(WAVE_TARGET>=all.length)WAVE_TARGET=0;
  const rows=editing?[all[WAVE_TARGET]]:all;
  const maxM=editing?Math.max(rows[0].m,0.02):Math.max(...rows.map(r=>r.m),0.4);
  const W=560,padL=132,padR=54,padT=16,laneH=74,H=padT+rows.length*laneH+30;

  const ticks=[maxM,maxM/2,0].map(m=>{const lb=tickLabel(m);
    return `<line x1="${x(m)}" y1="${padT-2}" x2="${x(m)}" y2="${H-22}" stroke="#eef2f7"/>
      <text x="${x(m)}" y="${H-8}" text-anchor="middle" font-size="12" fill="#71828f">${lb}</text>`;}).join("");
  const GEO=[];let body="";const laneEvts=[];
  rows.forEach((r,ri)=>{
    const top=padT+ri*laneH;
    const yHi=top+12, yLo=top+laneH-26;          // 上=つらい / 下=軽い
    const col=symptomColor(r.s);
    const x0=x(r.m);
    const xs=[];for(let i=0;i<WAVE_N;i++)xs.push(x0+(now-x0)*(i/(WAVE_N-1)));
    const wv=waveArr(r.s);
    const yOf=v=>yLo-(yLo-yHi)*v;
    const pts=xs.map((xx,i)=>`${xx.toFixed(1)},${yOf(wv[i]).toFixed(1)}`).join(" ");
    body+=`<line x1="${padL}" y1="${top+laneH-12}" x2="${now}" y2="${top+laneH-12}" stroke="#eef2f7"/>`;
    body+=`<text x="${padL-10}" y="${top+laneH/2+4}" text-anchor="end" font-size="13" fill="#16222e">${r.s.length>11?r.s.slice(0,10)+"…":r.s}</text>`;
    body+=`<polyline id="wl${ri}" points="${pts}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>`;
    ((D.sx[r.s]&&D.sx[r.s].events)||[]).forEach(e=>{
      const em=eventMonths(e);if(em==null||em>maxM+0.001)return;
      laneEvts.push({xe:x(em),yHi,yLo,col,s:r.s,bucket:e.bucket,tag:e.tag,note:e.note});
    });
    if(editable&&WAVE_EDIT)xs.forEach((xx,i)=>{body+=`<circle class="wdot" data-r="${ri}" data-i="${i}" id="wd${ri}_${i}" cx="${xx.toFixed(1)}" cy="${yOf(wv[i]).toFixed(1)}" r="13" fill="#fff" stroke="${col}" stroke-width="3"/>`;});
    GEO.push({s:r.s,yHi,yLo,xs});
  });
  window.__WAVE={geo:GEO};
  const nowLine=`<line x1="${now}" y1="${padT-2}" x2="${now}" y2="${H-22}" stroke="var(--warn)" stroke-dasharray="3 3"/>
    <text x="${now}" y="${padT-4}" text-anchor="middle" font-size="10" fill="var(--warn)">今</text>`;
  const vm=visitMonths();
  const visitLine=(vm!=null&&vm<=maxM+0.001)?`<line x1="${x(vm).toFixed(1)}" y1="${padT-2}" x2="${x(vm).toFixed(1)}" y2="${H-22}" stroke="#c0392b" stroke-width="2"/>
    <text x="${x(vm).toFixed(1)}" y="${padT+9}" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="700">受診理由</text>`:"";
  const sortedEvts=[...laneEvts].sort((a,b)=>a.xe-b.xe);

    const num=i+1;

      <circle cx="${e.xe.toFixed(1)}" cy="${(e.yHi+6).toFixed(1)}" r="7" fill="#fff" stroke="${e.col}" stroke-width="2"/>
      <text x="${e.xe.toFixed(1)}" y="${(e.yHi+9).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="800" fill="${e.col}">${num}</text>`;
    evFoot+=`<div style="display:flex;gap:7px;align-items:baseline;margin:2px 0;font-size:calc(12.5px*var(--fs))">
      <span style="flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid ${e.col};color:${e.col};font-weight:800;font-size:10px;display:inline-flex;align-items:center;justify-content:center">${num}</span>
      <span><b style="color:${e.col}">${esc(e.s)}</b>：${esc(e.bucket)}・${esc(e.tag)}${e.note?`（${esc(e.note)}）`:""}</span></div>`;
  });
  const btn=(lab,fn)=>`<button type="button" onclick="${fn}" style="font-size:calc(14px*var(--fs));padding:10px 16px;border:1.5px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;color:var(--sub);font-weight:700;font-family:inherit">${lab}</button>`;
  const chips=(editing&&all.length>=2)?`<div class="hint" style="margin:8px 0 4px">調整する症状をえらぶ</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px">`+all.map((r,i)=>
      `<button type="button" onclick="setWaveTarget(${i})" style="font-size:calc(13px*var(--fs));padding:8px 13px;min-height:36px;border:1.5px solid ${symptomColor(r.s)};background:${i===WAVE_TARGET?symptomColor(r.s):"#fff"};color:${i===WAVE_TARGET?"#fff":symptomColor(r.s)};border-radius:20px;cursor:pointer;font-weight:700;font-family:inherit">${esc(r.s)}</button>`).join("")+`</div>`:"";
  const controls=editable?(editing
    ?`${chips}<div class="hint" style="margin:8px 0 2px">👆 丸を<b>上下に</b>動かして、その時期の「つらさ」を線にできます（上＝つらい／下＝軽い）。だいたいで大丈夫です。${all.length>=2?"<br>※ 調整中は、えらんだ症状だけを横幅いっぱいに広げて表示しています。":""}</div>
      <div style="text-align:right;margin-top:4px;display:flex;gap:8px;justify-content:flex-end">${btn("↺ この線を描き直す",`resetWaves('${rows[0].s.replace(/'/g,"")}')`)}${btn("✓ 調整をおわる","WAVE_EDIT=false;render()")}</div>`
    :`<div style="text-align:right;margin-top:4px">${btn("✏ 線を指で調整する（任意）","WAVE_EDIT=true;render()")}</div>`):"";
  const legend=`<div class="chartcap" style="font-size:calc(13px*var(--fs));color:var(--sub);margin-top:6px">縦＝つらさ（上ほど強い）／横＝時間（左が昔・右が今）。ご本人・ご家族の実感を表した線です。線の色は症状ごとです。</div>`;
  return `<div class="blk trblk"><h4 style="color:var(--brand-d);margin:14px 0 4px">📈 ${editing?`調整中：${esc(rows[0].s)}`:"症状の推移（症状ごとの詳細）"}</h4>
    <svg id="${editable?'wsvg':'wsvg-ro'}" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:${W}px;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none">
      ${ticks}${nowLine}${visitLine}${evBody}${body}</svg>${controls}${legend}
    ${evFoot?`<div style="margin-top:8px">${evFoot}</div>`:""}</div>`;}
/* ドラッグ操作の割り当て（sxtime画面の描画後に呼ぶ）。描画中はrender()しないので途中で失われない */
function attachWaveHandlers(){
  const svg=document.getElementById("wsvg");if(!svg||!window.__WAVE)return;
  const geo=window.__WAVE.geo;let cur=null;
  const toSvg=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
  svg.querySelectorAll(".wdot").forEach(dot=>{
    dot.addEventListener("pointerdown",e=>{e.preventDefault();cur={r:+dot.dataset.r,i:+dot.dataset.i,el:dot};
      try{dot.setPointerCapture(e.pointerId);}catch(_){}dot.setAttribute("r","12");dot.setAttribute("fill","#dcecfb");});
  });
  svg.addEventListener("pointermove",e=>{
    if(!cur)return;e.preventDefault();
    const g=geo[cur.r];const loc=toSvg(e);
    const y=Math.max(g.yHi,Math.min(g.yLo,loc.y));
    const v=(g.yLo-y)/(g.yLo-g.yHi);
    cur.el.setAttribute("cy",y.toFixed(1));
    const s=g.s;D.sx[s]=D.sx[s]||{};if(!D.sx[s].wave||D.sx[s].wave.length!==WAVE_N)D.sx[s].wave=waveArr(s).slice();
    D.sx[s].wave[cur.i]=v;
    const line=document.getElementById("wl"+cur.r);
    line.setAttribute("points",g.xs.map((xx,i)=>xx.toFixed(1)+","+document.getElementById("wd"+cur.r+"_"+i).getAttribute("cy")).join(" "));
  });
  const end=e=>{if(!cur)return;try{cur.el.releasePointerCapture(e.pointerId);}catch(_){}cur.el.setAttribute("r","9");cur.el.setAttribute("fill","#fff");cur=null;};
  svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
}
function resetWaves(only){(only?[only]:D.symptoms).forEach(s=>{if(D.sx[s])delete D.sx[s].wave;});render();}

/* ===== 部品 ===== */
function card(inner){return `<div class="card">${inner}</div>`;}
function escAttr(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
/* 自由記述をinnerHTMLへ差し込む前に必ず通すHTMLエスケープ（XSS対策）。escAttrと同じ実装だが、
   「属性用」ではなく「本文用」であることを呼び出し側で読み取りやすくするための別名。 */
function esc(s){return escAttr(s);}
function spkBtn(text){return `<button class="spk no-print" data-say="${escAttr(text)}" onclick="speakEl(this)" aria-label="読み上げ">🔊</button>`;}
function qhead(n,q,sub){const say=stripHtml(q)+(sub?"。"+stripHtml(sub):"");
  return `<div class="qhead"><span class="qnum">${n}</span>
  <span class="qtext">${q}${sub?`<br><span style="font-weight:500;font-size:calc(13px*var(--fs));color:var(--sub)">${sub}</span>`:""}</span>${spkBtn(say)}</div>`;}
/* 文字列生成時にタグを除去（読み上げ用） */
function stripHtml(h){return String(h).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();}
function opt(sel,label,onclick,multi){return `<button type="button" aria-pressed="${!!sel}" class="opt ${multi?'multi':''} ${sel?'sel':''}" onclick="${onclick}">${label}</button>`;}

let TTS_ON=false;

/* ===== 1問ずつ表示（1画面1問） ===== */
let ONE_Q=false,ONEQ_IDX=0;
function toggleOneQ(){ONE_Q=!ONE_Q;ONEQ_IDX=0;
  const b=document.getElementById("oneqBtn");if(b)b.classList.toggle("on",ONE_Q);render();}
function oneQPrev(){ONEQ_IDX--;render();}
function oneQNext(){ONEQ_IDX++;render();}
function applyOneQ(screenChanged){
  if(!ONE_Q)return;
  const qScreens=["who","common","module","bg","assoc","daily","sxtime"];
  if(!qScreens.includes(phase))return;
  const card=[...app.querySelectorAll(".card")].find(c=>c.querySelector(".qhead,.grouplab,.qunit"));
  if(!card)return;
  const kids=[...card.childNodes];const groups=[];let intro=[],cur=null;
  const isStart=n=>n.nodeType===1&&n.classList&&
    (n.classList.contains("qhead")||n.classList.contains("grouplab")||n.classList.contains("qunit"));
  kids.forEach(n=>{
    if(isStart(n)){cur=[n];groups.push(cur);}else if(cur)cur.push(n);else intro.push(n);});
  /* 見出しだけで選択肢を含まないグループは、次のグループに結合（空ステップを作らない） */
  const hasUI=g=>g.some(n=>n.nodeType===1&&n.querySelector&&
    (n.matches(".opts,.triwrap,textarea,.qunit,.bodywrap")||!!n.querySelector(".opt,.tri,textarea,input,.reg")));
  for(let i=0;i<groups.length-1;i++){
    if(!hasUI(groups[i])){groups[i+1]=groups[i].concat(groups[i+1]);groups.splice(i,1);i--;}}
  if(groups.length<2)return;
  if(screenChanged)ONEQ_IDX=0;
  ONEQ_IDX=Math.max(0,Math.min(ONEQ_IDX,groups.length-1));
  card.innerHTML="";
  intro.forEach(n=>card.appendChild(n));
  groups.forEach((g,gi)=>{const w=document.createElement("div");w.className="qstep";
    if(gi!==ONEQ_IDX)w.style.display="none";g.forEach(n=>w.appendChild(n));card.appendChild(w);});
  const nav=document.createElement("div");nav.className="qstepnav no-print";
  nav.innerHTML=`<button ${ONEQ_IDX===0?"disabled":""} onclick="oneQPrev()">◀ 前</button>
    <span>この画面の質問 ${ONEQ_IDX+1} / ${groups.length}</span>
    <button ${ONEQ_IDX===groups.length-1?"disabled":""} onclick="oneQNext()">次 ▶</button>`;
  card.appendChild(nav);
}

/* ===== 状態のURL引き継ぎ（サーバー保存なし・URLに載せる） =====
   QR上限（約2900字）対策として、空値・空配列を落として軽量化する */
/* ===== 引き継ぎデータの圧縮 =====
   選択式の回答を「選択肢の何番目か」に置き換えてから deflate 圧縮する。
   表示用の日本語をそのままURLに載せていた従来方式では、ひととおり入力しただけで
   URLが4500字を超え、既存の2900字ガードに掛かってQRが作れなかった
   （自由記述が0字の時点で作れなかった）。番号化＋圧縮なら、自由記述を800字
   入れてもQR v15（画面表示230pxで1マス0.47mm）に収まり、実用上読み取れる。

   ★安全装置★ 番号は選択肢の並び順そのものなので、設定ブロックの選択肢を
   編集すると古いQRの意味がずれる。SCHEMA_SIG は全選択肢から自動計算する符号で、
   設定を1文字でも変えれば値が変わる。復元時に符号が一致しないデータは
   黙って誤読せず、明示的に失敗させる（番号の手動メンテナンスは不要）。 */
function qmOpts(id,k){const it=(QM[id]||[]).find(x=>x.k===k);return it&&it.o?it.o:[];}
function commonOpts(k){const it=COMMON.find(c=>c.k===k);return it&&it.o?it.o:[];}
function codecDicts(){return {
  who:WHO.map(x=>x[0]), ageBand:AGES, hand:OPT_HAND, sym:SYMPTOMS.map(x=>x[0]),
  onset:ONSET_OPTS.map(x=>x[0]), sev:SEV_OPTS, trend:TREND_OPTS, evtag:EVENT_TAGS,
  tempo:commonOpts("tempo"), course:commonOpts("course"), side:commonOpts("side"),
  relapse:OPT_RELAPSE, relapseRecover:OPT_RELAPSE_RECOVER, freq:OPT_FREQ,
  episodeDur:OPT_EPISODE_DUR, severity:OPT_SEVERITY,
  aggravTags:AGGRAV_TAGS, reliefTags:RELIEF_TAGS,
  assoc:ASSOC, func:FUNC, visited:VISITED,
  risk:BG_RISK, immune:BG_IMMUNE, lifestyle:BG_LIFESTYLE, exposure:BG_EXPOSURE,

    if(b){b.classList.remove("rec");b.textContent="🎤 声で入力する";}stat.textContent="（停止しました。文字での修正もできます）";};
  rec.start();
}

/* ===== AI整理（モック：中立テンプレート。4軸で要約） =====
   各文に入力元画面(ph)を持たせ、確認画面から「直す」で該当画面へ戻れるようにする */
function buildSummary(){
  if(D.editedSummary!==undefined)return D.editedSummary;
  return buildSummaryParts().map(p=>p.t).join("\n");
}
function buildSummaryParts(){
  const c=D.common;const parts=[];
  /* 時間軸 */
  const onsetExact=fmtWhen("onset");const onsetLab=overallOnset();
  const onset=onsetExact?`${onsetExact}から`:(onsetLab&&onsetLab!=="わからない"?`${onsetLab}から`:"発症時期は不明だが");
  const tempo=c.tempo&&c.tempo!=="わからない"?c.tempo.replace(/（.*?）/,""):null;
  const course=c.course&&c.course!=="わからない"?c.course:null;
  const worsen=fmtWhen("worsen");
  let lead=onset;if(tempo)lead+=`「${tempo}」の経過`;
  if(c.freq&&c.freq!=="わからない")lead+=`、頻度は${c.freq}`;
  if(c.episodeDur&&c.episodeDur!=="わからない")lead+=`（1回の持続は${c.episodeDur}）`;
  if(worsen)lead+=`、${worsen}にさらに悪化`;if(course)lead+=`、現在は${course}`;
  parts.push({t:lead+"。",ph:"common"});
  /* 再発・寛解 */
  if(c.relapse&&c.relapse!=="わからない"){
    let rl="";
    if(c.relapse==="はじめて")rl="今回がはじめてです。";
    else rl=`過去にも同様の症状が${c.relapse}`+(c.relapseRecover?`（前回は${c.relapseRecover}で良くなった）`:"")+"。";
    parts.push({t:rl,ph:"common"});
  }
  if(c.visitBucket)parts.push({t:`今回、受診しようと思うほど悪くなったのは${c.visitBucket}ごろ。`,ph:"sxtime"});
  /* 症状が出た順序（時系列） */
  const ordered=D.symptoms.map(s=>({s,m:sxMonths(s)})).filter(r=>r.m!=null).sort((a,b)=>b.m-a.m);
  if(ordered.length>=2)parts.push({t:"出現の順序："+ordered.map(r=>r.s).join(" → ")+"。",ph:"sxtime"});
  const evtAll=[];D.symptoms.forEach(s=>{((D.sx[s]&&D.sx[s].events)||[]).forEach(e=>evtAll.push(Object.assign({s:s},e,{m:eventMonths(e)})));});
  evtAll.sort((a,b)=>(b.m==null?-1:b.m)-(a.m==null?-1:a.m));
  if(evtAll.length)parts.push({t:"経過の目印："+evtAll.map(e=>`${e.bucket}に${(e.tag==="その他"&&e.note)?e.note:e.tag}（${e.s}）`).join("、")+"。",ph:"sxtime"});
  if(c.severity)parts.push({t:`生活への支障：${c.severity}。`,ph:"common"});
  const aggr=[...(c.aggravTags||[])];if(c.aggrav)aggr.push(c.aggrav.trim());
  if(aggr.length)parts.push({t:"悪くなるきっかけ："+aggr.join("・")+"。",ph:"common"});
  const rel=[...(c.reliefTags||[])];if(c.relief)rel.push(c.relief.trim());
  if(rel.length)parts.push({t:"楽になること："+rel.join("・")+"。",ph:"common"});
  /* 局在の手がかり（モジュール） */
  D.mods.forEach(id=>{const m=D.m[id];let f="";
    if(id===1){const w=(m.what||[]).join("・");if(w)f+=`歩行に関して${w}。`;
      if(m.fall&&m.fall!=="なし")f+=`転倒は${m.fall}（${m.falldir||"方向不明"}）。`;
      const inj=(m.fallinj||[]).filter(x=>x!=="ケガはない");if(inj.length)f+=`転倒による外傷：${inj.join("・")}。`;}
    else if(id===2){const w=(m.main||[]).join("・");const ar=(m.area||[]).join("・");
      if(w)f+=`${w}が${ar?ar+"に":""}ある。`;if(m.prox)f+=`症状が強いのは${m.prox}。`;}
    else if(id===3){const w=(m.main||[]).join("・");if(w)f+=`${w}がある。`;
      if(m.diurnal&&m.diurnal!=="わからない")f+=`朝と夕方の様子：${m.diurnal}。`;
      if(m.lid&&m.lid!=="下がらない")f+=`まぶたは${m.lid}。`;}
    if(f)parts.push({t:f,ph:"module",mod:id});});
  if(c.side&&!["左右は関係ない（全身・真ん中）","わからない"].includes(c.side))parts.push({t:`左右差は${c.side}。`,ph:"common"});
  /* 一緒に出ている症状 */
  const pos=ASSOC.filter(k=>D.assoc[k]==="y");
  if(pos.length)parts.push({t:"一緒に出ている症状："+pos.map(x=>x.replace(/（.*?）/,"")).join("・")+"あり。",ph:"assoc"});
  /* 機能 */
  if(D.func.length)parts.push({t:"生活面では"+D.func.join("・")+"に支障。",ph:"daily"});
  /* ふだんの困りごと（領域ごとにまとめる） */
  if(D.daily.length){
    const dg=DAILY_GROUPS.filter(g=>dSel(g).length)
      .map(g=>g.g+"（"+dSel(g).map(it=>it.t).join("・")+"）");
    parts.push({t:"ふだんの困りごと："+dg.join("、")+"。",ph:"daily"});
  }
  /* 見えにくさの詳細 */
  const vb=[];
  if(D.vis.side&&D.vis.side!=="わからない")vb.push(D.vis.side);
  if(D.vis.note)vb.push(D.vis.note.trim());
  if(vb.length)parts.push({t:"目の症状："+vb.join("／")+"。",ph:"daily"});
  /* 背景 */
  const bgp=[];
  if(D.bg.risk.length)bgp.push(D.bg.risk.join("・"));
  if(D.bg.med&&D.bg.med!=="飲んでいない"&&D.bg.med!=="わからない")bgp.push(D.bg.med+(D.bg.medText?`（${D.bg.medText}）`:""));
  if(D.bg.dopaDrug&&(D.bg.dopaDrug.includes("飲")))bgp.push("動作の遅さ・ふるえに関係しうる薬："+D.bg.dopaDrug);
  if(D.bg.family==="いる")bgp.push("似た症状の家族あり");
  if(D.bg.autonomic&&D.bg.autonomic.length)bgp.push("尿・立ちくらみ・便秘などの症状："+D.bg.autonomic.join("・"));
  if(D.bg.preInfection&&["あった","ワクチン接種のあとから"].includes(D.bg.preInfection))bgp.push("症状の前の感染・予防接種："+D.bg.preInfection);
  if(D.bg.pregnancy&&["妊娠中","授乳中"].includes(D.bg.pregnancy))bgp.push(D.bg.pregnancy);
  if(D.bg.immune.length)bgp.push(D.bg.immune.join("・"));
  if(D.bg.lifestyle.length)bgp.push(D.bg.lifestyle.join("・"));
  if(D.bg.exposure.length)bgp.push(D.bg.exposure.join("・"));
  if(D.bg.history)bgp.push("これまでの病気・手術："+D.bg.history.trim());
  if(D.bg.allergy)bgp.push("アレルギー："+D.bg.allergy.trim());
  if(bgp.length)parts.push({t:"背景："+bgp.join("、")+"。",ph:"bg"});
  if(D.visited.length)parts.push({t:"既受診："+D.visited.join("・")+"。",ph:"bg"});
  if(D.tests)parts.push({t:"受けた検査："+D.tests.trim(),ph:"bg"});
  return parts;
}
function nowStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
/* 発症→悪化→現在 の横向きタイムライン。時期情報がなければ非表示 */
function timelineHtml(){
  const c=D.common;
  const onset=fmtWhen("onset")||(overallOnset()&&overallOnset()!=="わからない"?overallOnset():null);
  const worsen=fmtWhen("worsen");
  if(!onset&&!worsen)return "";
  const pts=[{lab:"発症",sub:onset||"時期不明",cls:"start"}];
  if(worsen)pts.push({lab:"さらに悪化",sub:worsen,cls:"worse"});
  pts.push({lab:"現在（受診）",sub:(c.course&&c.course!=="わからない"?c.course:nowStr()),cls:"now"});
  return `<div class="tl">`+pts.map((p,i)=>
    `<div class="tlp ${p.cls}"><span class="dot"></span><div class="tll"><b>${p.lab}</b>${p.sub}</div></div>`+
    (i<pts.length-1?`<div class="tlbar"></div>`:``)
  ).join("")+`</div>`;
}
function whoLabel(){const f=WHO.find(w=>w[0]===D.who);return f?f[1]:"—";}

function assocGrouped(){
  return ASSOC_GROUPS.map(grp=>{
    const inner=grp.items.map(nm=>{const v=D.assoc[nm];const s=nm.replace(/（.*?）/,"");
      if(v==="y")return `<span class="y">${s}＋</span>`;if(v==="n")return `<span class="n">${s}−</span>`;
      return `<span class="u">${s}?</span>`;}).join("　");
    return `<div><span class="g">${grp.g}:</span> ${inner}</div>`;
  }).join("");
}
/* 注意サイン（見落とし防止の目印）。
   絶対方針: 病名・局在名・疾患を示唆する語（「〜の疑い」「〜様」等）は出力しない。記述的表現のみ。 */
function redFlags(){
  const c=D.common,A=D.assoc,f=[];
  if(A["息苦しさ"]==="y")f.push("息苦しさあり");
  if(A["飲み込みにくさ・むせ"]==="y")f.push("飲み込みにくさ・むせあり");
  if(A["ろれつが回りにくい"]==="y")f.push("ろれつの回りにくさあり");
  if(A["筋肉がやせる・ぴくつく"]==="y")f.push("筋肉のやせ・ぴくつきあり");
  if(c.tempo&&(c.tempo.includes("突然")||c.tempo.includes("急に")))f.push("急な発症（秒〜数日）");
  if(c.course&&c.course.includes("悪くなって"))f.push("進行性の悪化");
  const diu=(D.m[3]&&D.m[3].diurnal);
  if(diu&&(diu.includes("夕方")||diu.includes("使うと悪化")))f.push("夕方の増悪・易疲労性あり");
  if(c.relapse&&c.relapse.includes("くり返"))f.push("出て治まるをくり返す経過");
  return f;
}
/* 陽性所見サマリ（医師が最初の10秒で骨格を掴む1〜2行） */
function posSummary(){
  const c=D.common,seg=[];
  const on=fmtWhen("onset")||((overallOnset()&&overallOnset()!=="わからない")?overallOnset():null);
  if(on)seg.push(on+"発症");
  if(c.tempo&&c.tempo!=="わからない")seg.push(c.tempo.replace(/（.*?）/,""));
  if(c.course&&c.course!=="わからない")seg.push(c.course);
  if(c.side&&!["左右は関係ない（全身・真ん中）","わからない"].includes(c.side))seg.push(c.side);
  if(D.mods.includes(1)&&D.m[1].fall&&D.m[1].fall!=="なし")seg.push("転倒"+D.m[1].fall);
  if(D.mods.includes(2)&&D.m[2].prox&&D.m[2].prox!=="わからない")seg.push("分布:"+D.m[2].prox);
  const diu=(D.m[3]&&D.m[3].diurnal);
  if(diu&&diu!=="わからない"&&diu!=="一日中同じ")seg.push(diu);
  const pos=ASSOC.filter(k=>D.assoc[k]==="y").map(x=>x.replace(/（.*?）/,""));
  if(pos.length)seg.push("随伴＋: "+pos.join("・"));
  if(D.func.length)seg.push("ADL支障: "+D.func.slice(0,3).join("・")+(D.func.length>3?" 他":""));
  return seg.join("／");
}
/* kv行の共通化：値ありのみ表示し、未聴取は末尾に集約（「—」の曖昧さをなくす） */
function kvSec(pairs){
  const have=pairs.filter(x=>x[1]);
  const miss=pairs.filter(x=>!x[1]);
  if(!have.length)return miss.length?'<span class="mini">未聴取</span>':"";
  return `<div class="kv">${have.map(([k,v])=>`<div><b>${esc(k)}</b><br>${esc(String(v))}</div>`).join("")}</div>`;
}
/* ===== 入力から見える症候パターン（症候群・局在レベル） =====
   絶対方針の範囲内で運用すること：病名・診断名・確率・治療方針は一切出さない。
   ここで出すのは「入力された所見のまとまり（症候群・局在）」と
   「診察で確認するとよい所見」だけ。判定の根拠になった患者・家族の回答を
   必ず ev として併記し、医師がその場で妥当性を検証して棄却できるようにする
   （自己申告のみの情報で医師の初診時の思考を固定しないためのアンカリング対策）。 */
function syndromePatterns(){
  const c=D.common,A=D.assoc,m1=D.m[1]||{},m2=D.m[2]||{},m3=D.m[3]||{},out=[];
  const yes=n=>A[n]==="y",no=n=>A[n]==="n";
  const inA=(a,v)=>Array.isArray(a)&&a.indexOf(v)>=0;
  const sym=s=>D.symptoms.indexOf(s)>=0;
  const dHas=id=>D.daily.indexOf(id)>=0;
  const push=(name,core,ev,ask,min)=>{if(core&&ev.length>=(min||2))out.push({name:name,ev:ev,ask:ask});};

  /* 神経筋接合部（日内変動・易疲労性） */
  {const diu=m3.diurnal;
   const core=!!(diu&&(diu.indexOf("夕方")>=0||diu.indexOf("使うと悪化")>=0));const ev=[];
   if(core)ev.push("日内変動："+diu);
   if(m3.lid&&m3.lid!=="下がらない")ev.push("まぶた："+m3.lid);
   if(inA(m3.main,"物が二重に見える")||sym("ものが二重に見える"))ev.push("複視");
   if(sym("疲れると悪くなる・夕方につらい")||inA(m3.main,"疲れると見えにくい"))ev.push("疲れで悪化");
   if(dHas("battery"))ev.push("使っていると電池切れのように動けなくなる");
   push("神経筋接合部のパターン（日内変動・易疲労性）",core,ev,
     "上方注視の維持による眼瞼下垂の増悪、反復動作での筋力低下、球症状の日内変動、頸部屈筋の易疲労");}

  /* 動作緩慢・寡動を軸とするパターン */
  {const core=yes("動作が遅い・小さくなった")||(yes("安静にしていても手がふるえる")&&yes("表情が乏しい・声が小さい"));
   const ev=[];
   if(yes("動作が遅い・小さくなった"))ev.push("動作が遅い・小さくなった");
   if(yes("安静にしていても手がふるえる"))ev.push("安静時のふるえ");
   if(yes("表情が乏しい・声が小さい"))ev.push("表情が乏しい・声が小さい");
   if(inA(m1.what,"足が出ない・すくむ"))ev.push("足が出ない・すくむ");
   if(yes("においが分かりにくい"))ev.push("においが分かりにくい");
   if(yes("夢で大声・手足が動く（睡眠中）"))ev.push("睡眠中の大声・手足の動き");
   if(D.bg.autonomic&&D.bg.autonomic.length)ev.push("自律神経症状："+D.bg.autonomic.join("・"));
   if(c.tempo&&(c.tempo.indexOf("ゆっくり")>=0||c.tempo.indexOf("だんだん")>=0))ev.push("経過："+c.tempo);
   const drug=D.bg.dopaDrug&&["飲んでいる／最近飲んだ","以前飲んでいた"].indexOf(D.bg.dopaDrug)>=0;
   if(drug)ev.push("動作の遅さ・ふるえに関係しうる薬："+D.bg.dopaDrug);
   push("動作緩慢・寡動を軸とするパターン",core,ev,
     "左右差、固縮と姿勢反射、小刻み歩行やすくみ足の有無、症状の出現順序"+
     (drug?"、薬剤の使用時期と症状出現の時間関係":""));}

  /* 再発と寛解をくり返す経過（時間的多発） */
  {const core=!!((c.relapse&&c.relapse.indexOf("回")>=0)||(c.tempo&&c.tempo.indexOf("出たり治ったり")>=0));
   const ev=[];
   if(c.relapse&&c.relapse.indexOf("回")>=0)ev.push("過去のエピソード："+c.relapse);
   if(c.tempo&&c.tempo.indexOf("出たり治ったり")>=0)ev.push("経過："+c.tempo);
   if(c.relapseRecover)ev.push("前回の回復："+c.relapseRecover);
   if(yes("視力が落ちた・目が痛い")||sym("視力が落ちた・目が痛い"))ev.push("視力低下・眼痛");
   if(yes("胴体・脚に帯のようなしめつけ感"))ev.push("帯のようなしめつけ感");
   if(yes("しびれ・感覚の鈍さ"))ev.push("しびれ・感覚の鈍さ");
   if(inA(c.aggravTags,"暑いとき・入浴後"))ev.push("暑いとき・入浴後に悪化");
   push("再発と寛解をくり返す経過（時間的多発）",core,ev,
     "過去のエピソードごとの部位・持続・回復の程度、暑さや入浴での一過性の増悪、頸部前屈での電撃様感覚");}

  /* 筋萎縮・線維束性収縮を伴うパターン */
  {const core=yes("筋肉がやせる・ぴくつく")||sym("手足がやせる・ぴくつく");
   const ev=[];
   if(core)ev.push("筋のやせ・ぴくつき");
   if(c.course&&c.course.indexOf("悪くなって")>=0)ev.push("経過："+c.course);
   if(yes("ろれつが回りにくい"))ev.push("ろれつが回りにくい");
   if(yes("飲み込みにくさ・むせ"))ev.push("飲み込みにくさ・むせ");
   if(yes("息苦しさ"))ev.push("息苦しさ");
   if(no("しびれ・感覚の鈍さ"))ev.push("感覚の鈍さは陰性");
   push("筋萎縮・線維束性収縮を伴うパターン",core,ev,
     "上位・下位運動ニューロン徴候の併存、感覚障害の有無、呼吸機能、体重減少の有無");}

  /* 脊髄レベルを示唆するパターン */
  {const core=yes("胴体・脚に帯のようなしめつけ感");
   const ev=[];
   if(core)ev.push("胴体・脚の帯のようなしめつけ感");
   if(inA(m2.area,"両脚"))ev.push("両脚の症状");
   if(inA(D.bg.autonomic,"尿が近い・もれる・出にくい"))ev.push("排尿のトラブル");
   if(inA(D.func,"トイレ（排尿・排便）"))ev.push("排尿・排便のADL支障");
   push("脊髄レベルを示唆するパターン",core,ev,
     "感覚レベルの有無、腱反射・病的反射、膀胱直腸機能、頸部・背部の疼痛");}

  /* 遠位優位・左右対称の末梢神経パターン */
  {const core=m2.prox==="手足の先"||inA(m2.area,"手足の先（手袋・くつ下のように）");
   const ev=[];
   if(core)ev.push("分布：手足の先（遠位優位）");
   if(c.side==="左右で同じくらい")ev.push("左右差：左右で同じくらい");
   if(yes("しびれ・感覚の鈍さ"))ev.push("しびれ・感覚の鈍さ");
   if(inA(D.bg.risk,"糖尿病"))ev.push("背景：糖尿病");
   if(c.tempo&&(c.tempo.indexOf("ゆっくり")>=0||c.tempo.indexOf("だんだん")>=0))ev.push("経過："+c.tempo);
   if(dHas("temp"))ev.push("お湯の温度が分かりにくい");
   push("遠位優位・左右対称の末梢神経パターン",core,ev,
     "遠位優位の感覚低下と腱反射の低下、左右対称性、背景（糖尿病・アルコール・薬剤・ビタミン）の確認");}

  /* 近位筋優位の脱力パターン */
  {const core=m2.prox==="肩や太ももに近い方";
   const ev=[];
   if(core)ev.push("分布：肩や太ももに近い方（近位優位）");
   if(inA(m2.main,"力が入らない"))ev.push("力が入らない");
   if(inA(D.func,"階段の上り下り"))ev.push("階段の上り下りに支障");
   if(inA(m1.what,"立ち上がりにくい"))ev.push("立ち上がりにくい");
   if(no("しびれ・感覚の鈍さ"))ev.push("感覚の鈍さは陰性");
   push("近位筋優位の脱力パターン",core,ev,
     "近位筋の徒手筋力、立ち上がり・階段動作、感覚障害の欠如、筋原性酵素");}

  /* 突然発症・局所性のパターン */
  {const core=!!(c.tempo&&c.tempo.indexOf("突然")>=0);
   const ev=[];
   if(core)ev.push("発症："+c.tempo);
   if(c.side&&["右のほうが強い","左のほうが強い"].indexOf(c.side)>=0)ev.push("左右差："+c.side);
   if(D.bg.risk&&D.bg.risk.length)ev.push("血管危険因子："+D.bg.risk.join("・"));
   push("突然発症・局所性のパターン",core,ev,
     "発症時刻の特定、症状の分布と左右差、血管危険因子・抗血栓薬の有無、発症時の状況");}

  /* 先行感染・ワクチン後の急性〜亜急性経過 */
  {const core=!!(D.bg.preInfection&&["あった","ワクチン接種のあとから"].indexOf(D.bg.preInfection)>=0);
   const ev=[];
   if(core)ev.push("症状の前の感染・予防接種："+D.bg.preInfection);
   if(c.tempo&&c.tempo.indexOf("急に")>=0)ev.push("経過："+c.tempo);
   if(inA(m2.main,"力が入らない")||sym("力が入らない"))ev.push("力が入らない");
   if(yes("しびれ・感覚の鈍さ"))ev.push("しびれ・感覚の鈍さ");
   push("先行感染・ワクチン後の急性〜亜急性経過",core,ev,
     "症状の広がり方（上行性か）、腱反射の減弱・消失、呼吸筋・球症状、先行感染からの日数");}

  /* 歩行障害・排尿・認知が揃うパターン */
  {const core=sym("歩きにくい")||sym("転びやすい")||D.mods.indexOf(1)>=0;
   const ev=[];
   if(core)ev.push("歩行障害");
   if(inA(D.bg.autonomic,"尿が近い・もれる・出にくい"))ev.push("排尿のトラブル");
   if(yes("物忘れ・性格や行動の変化"))ev.push("物忘れ・性格や行動の変化");
   push("歩行障害・排尿・認知が揃うパターン",core,ev,
     "歩行様式（開脚・小刻み・すくみ）、3つの症状の出現順序と時間経過、認知機能の評価",3);}

  /* 根拠の多い順に最大3つ。並べ過ぎるとかえって読む負担になるため絞る */
  return out.sort((a,b)=>b.ev.length-a.ev.length).slice(0,3);
}

  {const ps=posSummary();if(ps)L.push(`【陽性所見サマリ】 ${ps}`);}
  {const rf=redFlags();if(rf.length){L.push("");L.push("⚠ 注意サイン（見落とし防止・診断ではありません）");rf.forEach(x=>L.push("  ・"+x));}}
  L.push("");
  L.push("① 時間軸（発症・経過・順序）");
  L.push(`  発症時期(最古): ${fmtWhen("onset")?fmtWhen("onset"):(overallOnset()||"—")}`);

   rows.forEach(s=>{const r=D.sx[s];L.push(`   ・${s}: ${[r.onset,r.sev&&"つらさ"+r.sev,r.trend].filter(Boolean).join(" / ")}`);});
   const ord=D.symptoms.map(s=>({s,m:sxMonths(s)})).filter(r=>r.m!=null).sort((a,b)=>b.m-a.m);
   if(ord.length>=2)L.push(`  出現順序: ${ord.map(r=>r.s).join(" → ")}`);}

      if(v)r.push(`${it.q.replace(/（.*?）/,"").replace(/？$/,"")}: ${v}`);});

  L.push("");
  L.push(`⑥ 既受診科: ${D.visited.length?D.visited.join("・"):"—"}`);
  L.push(`  受けた検査: ${D.tests||"—"}`);
  L.push("");
  {const rows=prevCompareRows();
   if(rows.length){L.push(`◆ 前回からの変化${D.prev&&D.prev.date?`（前回 ${D.prev.date}）`:""}`);
     rows.forEach(r=>L.push(`  ${r.mark} ${r.s}: ${r.txt}`));L.push("");}}
  const pats=syndromePatterns();
  if(pats.length){
    L.push("◆ 入力から見える症候パターン（所見のまとまり・診断ではありません）");
    pats.forEach(p=>{L.push(`  ・${p.name}`);
      L.push(`      根拠: ${p.ev.join("／")}`);
      L.push(`      確認: ${p.ask}`);});
    L.push("  ※患者・家族の自己申告のみからの機械的な抽出です。診察所見・検査は含みません。");
    L.push("");
  }
  const u=unconfirmedItems();
  L.push("⑦ 未確認だが追加で聞くとよい項目（診断には言及しない）");
  L.push(u.length?u.map(x=>"  ・"+x).join("\n"):"  特になし");
  L.push("");
  L.push("⑧ 家族から見た変化 / 自由記載");
  L.push(`  原文: ${D.free||"（なし）"}`);
  L.push(sep);
  L.push("本シートは自己申告の整理です。病名・診断・治療方針の判断は医師が行ってください。個人情報は保存していません。");
  return L.join("\n");
}
function copySheet(){
  const txt=plainSheet();const btn=document.getElementById("copyBtn");
  const ok=()=>{if(!btn)return;btn.classList.add("done");btn.textContent="✓ コピーしました";
    setTimeout(()=>{btn.classList.remove("done");btn.textContent="📋 医療者シートをコピー";},2000);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(()=>fallbackCopy(txt,ok));
  }else fallbackCopy(txt,ok);
}
function fallbackCopy(txt,ok){
  const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");ok();}catch(e){alert("コピーできませんでした。手動で選択してください。");}
  document.body.removeChild(ta);
}

/* ===== 端末の「戻る」対応 =====
   画面遷移を履歴に積み、戻るで前の質問画面に戻れるようにする。
   これが無いと、待合室で戻るを1回押しただけでアプリ外に出て入力が全部消える。 */
let HIST_LOCK=false;   /* popstate起点の描画中は積み増さない */
function histState(){return {nbPhase:phase,nbMod:modCursor,nbOut:OUT};}
function syncHistory(){
  if(HIST_LOCK)return;
  const s=history.state;
  if(s&&s.nbPhase===phase&&s.nbMod===modCursor)return;   /* 同じ画面内の再描画では積まない */
  try{history.pushState(histState(),"",location.href);}catch(e){}
}
window.addEventListener("popstate",e=>{
  const s=e.state;if(!s||!s.nbPhase)return;
  HIST_LOCK=true;
  phase=s.nbPhase;modCursor=s.nbMod||0;if(s.nbOut)OUT=s.nbOut;
  render();
  HIST_LOCK=false;
});

/* ===== 誤ってページを離れたときの確認 =====
   入力内容は端末にもサーバーにも保存しないので、離脱＝やり直しになる。
   何か入力済みのときだけ確認を出す（意図的なやり直しでは出さない）。 */
let LEAVING=false;
function hasAnyInput(){
  if(D.symptoms&&D.symptoms.length)return true;
  if(D.who)return true;
  return !!(D.common&&(D.common.trouble||D.common.tempo))||!!D.free;
}
window.addEventListener("beforeunload",e=>{
  if(LEAVING||phase==="intro"||!hasAnyInput())return;
  e.preventDefault();e.returnValue="";
});

restoreState().then(()=>{
  try{history.replaceState(histState(),"",location.href);}catch(e){}
  render();
});
</script>
