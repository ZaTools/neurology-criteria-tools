<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- セキュリティ対策(CSP): このアプリは外部通信を一切行わない単一HTMLファイルのため、
     既定を'none'にしたうえで必要な例外のみ許可しています。
     script-src/style-styleに'unsafe-inline'が必要な理由: ビルド工程がなく、
     onclick=""属性とインラインの<style>を多用しているため（nonce方式は使えない）。
     connect-src が 'self' なのは、自分自身を取り直して版を確認する（キャッシュで古い版が
        表示され続けるのを防ぐ）ためです。外部への送信は引き続き遮断されています。
     ※ SAVE_ENDPOINT を設定して外部保存機能を使う場合は、connect-src に
        その保存先のオリジンを追加してください。
     ※ frame-ancestors（他サイトのiframeに埋め込まれるのを防ぐ＝クリックジャッキング対策）は
        <meta>では効かない仕様のため、実際にWeb公開する際はホスティング側の設定
        （HTTPレスポンスヘッダーの Content-Security-Policy か X-Frame-Options: DENY）で
        別途かけること。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);

<style>
  :root{
    --bg:#eef3f9; --card:#fff; --ink:#16222e; --sub:#5d6e7e;
    --line:#dbe3ee; --brand:#1b73c4; --brand-d:#11538f; --brand-l:#eaf3fc;
    --ok:#1a7a4a; --okbg:#e7f5ee; --warn:#b35618;
    --pos:#1a7a4a; --neg:#8a99a8; --unk:#b35618;
    --fs:1; --maxmain:680px;
  }
  *{box-sizing:border-box}
  button,.opt,.voice,[onclick]{touch-action:manipulation}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:calc(18px * var(--fs));line-height:1.75}
  body.fs-l{--fs:1.16} body.fs-xl{--fs:1.34}

  header{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(17,83,143,.18)}
  .hin{max-width:1120px;margin:0 auto;padding:11px 22px}
  .hbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
  .hctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .logo .dot{width:30px;height:30px;border-radius:9px;background:#fff;color:var(--brand);
    font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px}
  .logo .t{font-weight:700;font-size:17px;line-height:1.2}
  .logo .s{font-size:11.5px;opacity:.85}
  .fsbtns{display:flex;gap:5px;align-items:center}
  .fsbtns .cap{font-size:11px;opacity:.85;margin-right:2px}
  /* 高齢の方が最初に触る操作なので、タップ領域は最低40px確保する */
  .fsbtns button{border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.18);
    color:#fff;border-radius:8px;cursor:pointer;padding:5px 11px;line-height:1;
    white-space:nowrap;flex:0 0 auto;min-height:40px;min-width:40px}
  .fsbtns button.on{background:#fff;color:var(--brand)}
  .fsbtns .a1{font-size:12px} .fsbtns .a2{font-size:15px} .fsbtns .a3{font-size:18px}
  #mstep{margin-top:10px}
  #mstep .seg{display:flex;gap:4px}
  #mstep .seg i{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.3)}
  #mstep .seg i.done{background:#fff} #mstep .seg i.cur{background:#fff;opacity:.85}
  #mstep .lab{font-size:12px;opacity:.95;margin-top:5px}

  .layout{max-width:1120px;margin:0 auto;padding:0 22px;display:block}
  .side{display:none}
  .main{max-width:var(--maxmain);margin:0 auto;padding-bottom:140px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:22px;margin:18px 0;box-shadow:0 2px 12px rgba(20,50,80,.05)}
  h2{font-size:calc(23px * var(--fs));margin:.1em 0 .35em;letter-spacing:.01em}
  .lead{color:var(--sub);font-size:calc(15px * var(--fs));margin:0 0 6px}
  .qhead{display:flex;align-items:flex-start;gap:10px;margin:24px 0 12px}
  .qhead:first-child{margin-top:2px}
  .qnum{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--brand-l);
    color:var(--brand-d);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .qtext{font-weight:700;font-size:calc(18px * var(--fs));line-height:1.5}
  .hint{color:var(--sub);font-size:calc(15px * var(--fs));margin:-6px 0 12px 38px}
  .grouplab{font-weight:800;color:var(--brand-d);font-size:calc(15px*var(--fs));
    margin:18px 0 8px;padding-left:10px;border-left:4px solid var(--brand)}

  .opts{display:grid;grid-template-columns:1fr;gap:10px}
  .opts.grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .opts.grid .wideopt{grid-column:1/-1}
  .qunit{padding:12px 14px}
  .opt{position:relative;border:2px solid var(--line);background:#fcfdff;border-radius:14px;
    padding:17px 16px 17px 52px;cursor:pointer;font-size:calc(17px * var(--fs));
    user-select:none;transition:.12s;min-height:62px;display:flex;align-items:center;gap:8px}
  .opt:hover{border-color:#9fc3e8;background:#f7fbff}
  .opt:active{transform:scale(.99)}
  .opt::before{content:"";position:absolute;left:16px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;border:2px solid #c4d2e2;background:#fff}
  .opt.sel{border-color:var(--brand);background:var(--brand-l);font-weight:700;color:var(--brand-d)}
  .opt.sel::before{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 4px #fff}
  .opt.multi::before{border-radius:7px}
  .opt.multi.sel::before{background:var(--brand);box-shadow:none;content:"✓";color:#fff;
    font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
  .opt .emo{font-size:1.25em;margin-left:-2px}
  /* 選択肢はbutton要素（キーボード・スクリーンリーダー対応） */
  button.opt{font-family:inherit;text-align:left;width:100%;color:var(--ink);line-height:inherit;display:flex}
  button.opt.sel{color:var(--brand-d)}
  .opt:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  .tri button:focus-visible,button.nav:focus-visible,.qstepnav button:focus-visible,
  .fsbtns button:focus-visible,.copybtn:focus-visible,.voice:focus-visible{outline:3px solid var(--brand-d);outline-offset:2px}

  textarea{width:100%;min-height:84px;border:2px solid var(--line);border-radius:14px;
    padding:14px;font-size:calc(17px * var(--fs));font-family:inherit;resize:vertical;background:#fcfdff}
  textarea:focus{outline:none;border-color:var(--brand)}

  .triwrap{display:grid;grid-template-columns:1fr;gap:10px}
  .tri{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);
    border-radius:14px;padding:10px 10px 10px 14px;background:#fcfdff}
  .tri .nm{flex:1;font-size:calc(16px * var(--fs));font-weight:600;min-width:0}
  .tri .grp{display:flex;gap:6px;flex:0 0 auto}
  @media (max-width:559px){
    /* 幅が狭いときは、項目名を上・3択を下の2段にして名前が潰れないようにする */
    .tri{flex-direction:column;align-items:stretch;gap:8px;padding:12px 10px}
    .tri .grp{justify-content:stretch;flex-wrap:wrap}
    /* 「わからない」は5文字あるので、幅は文字数に合わせて配分する（はい・いいえを少し細く） */
    .tri .grp button{flex:1 1 auto;min-width:0;padding:12px 4px}
  }
  .tri button{border:1.5px solid var(--line);background:#fff;border-radius:11px;
    padding:12px 15px;font-size:calc(14px * var(--fs));cursor:pointer;color:var(--sub);font-weight:700;min-width:62px;white-space:nowrap}
  .tri button.on-y{background:var(--pos);color:#fff;border-color:var(--pos)}
  .tri button.on-n{background:#6b7b8b;color:#fff;border-color:#6b7b8b}
  .tri button.on-u{background:var(--unk);color:#fff;border-color:var(--unk)}
  /* コンサルトモードの所見3値：異常は赤、正常はグレー（＝明示的な陰性）、未実施はオレンジ */
  .tri button.on-ab{background:#b3402c;color:#fff;border-color:#b3402c}
  /* 医療者向けの選択チップ。患者向けの .opt（1個62px）は高齢の方に合わせた寸法で、
     14個並ぶ診療科などに使うと画面が長くなりすぎる。タップ域は44pxを確保する。 */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}
  .chip{border:1.5px solid var(--line);background:#fcfdff;border-radius:12px;padding:10px 14px;
    cursor:pointer;font-family:inherit;font-size:calc(15px*var(--fs));color:var(--ink);
    min-height:44px;display:inline-flex;align-items:center;line-height:1.35;text-align:left}
  .chip:hover{border-color:#9fc3e8}
  .chip.sel{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d);font-weight:800}

<script id="ichd3-engine">
/* ===== ICHD-3 rule engine（頭痛の criteria support・Phase 1）=====
   2026-09-11d。画面・DOM・入力データ（D）には一切触らない純関数だけを置く。
   入力は画面側の headacheFacts() が作る「正規化した事実（facts）」、出力は criterion ごとの
   met（充足）/ not_met（未充足）/ unknown（評価不能）の3値と、その根拠。
   ・回答がないものを not_met にしない（情報不足 ≠ 基準を満たさない）。
   ・最後の criterion（他の ICHD-3 診断でうまく説明されない）は常に unknown＝医師が確認する。
   ・診断を確定しない。出すのは「ICHD-3 の criteria をどこまで満たすか」だけ。
   ・二次性頭痛の Red flag は evaluateHeadacheRedFlags() で別に返し、画面側で ICHD 評価より先に出す。
   ICHD の改訂時は、このブロックだけを差し替える（質問の文言・画面は変えなくてよい）。
   準拠：The International Classification of Headache Disorders, 3rd edition（ICHD-3, 2018）。
   facts の形は画面側 headacheFacts() の説明を参照。範囲 {min,max} の単位は、持続＝分・頻度＝日/月・回数＝回。 */
const ICHD3=(function(){
  const MET="met",NOT="not_met",UNK="unknown";
  const tri=x=>x===true?MET:x===false?NOT:UNK;
  const and=(...xs)=>xs.includes(NOT)?NOT:(xs.every(x=>x===MET)?MET:UNK);
  const or=(...xs)=>xs.includes(MET)?MET:(xs.every(x=>x===NOT)?NOT:UNK);
  const neg=x=>x===MET?NOT:x===NOT?MET:UNK;
  /* n 個以上が met か。unknown を足しても届かなければ not_met */
  const atLeast=(n,xs)=>{const m=xs.filter(x=>x===MET).length,u=xs.filter(x=>x===UNK).length;
    return m>=n?MET:(m+u>=n?UNK:NOT);};
  /* 多くとも1つ（2つ以上 met なら not_met） */
  const atMostOne=xs=>{const m=xs.filter(x=>x===MET).length,u=xs.filter(x=>x===UNK).length;
    return m>=2?NOT:(m+u<=1?MET:UNK);};
  /* 範囲 r が [lo,hi] に収まるか。重なりが幅0（境目で接するだけ）なら not_met */
  const inRange=(r,lo,hi)=>{if(!r)return UNK;if(r.min>=lo&&r.max<=hi)return MET;
    return (Math.min(r.max,hi)-Math.max(r.min,lo)>0)?UNK:NOT;};
  /* 範囲 r が t 以上か（r は下限を含み上限を含まない：月15〜20日＝{15,21}） */
  const ge=(r,t)=>!r?UNK:(r.min>=t?MET:(r.max<=t?NOT:UNK));
  const SYM={[MET]:"✓",[NOT]:"×",[UNK]:"?"};
  const crit=(id,label,status,ev)=>({id,label,status,ev:ev||""});
  const lab=(r,none)=>r&&r.label?r.label:(none||"未回答");
  /* 共通：強さ（NRS 0–10 を 軽度1–3・中等度4–6・重度7–10 に換算） */
  const intensity=n=>n==null?null:(n>=7?"重度":n>=4?"中等度":n>=1?"軽度":"なし");
  const nrsEv=f=>f.nrs==null?"強さ未回答":`NRS ${f.nrs}/10（${intensity(f.nrs)}に換算）`;
  const sideEv=f=>({right:"いつも右側",left:"いつも左側",alternating:"片側（左右が入れかわる）",bilateral:"両側・頭全体"})[f.side]||"左右 未回答";
  const unilateral=f=>f.side?(f.side==="bilateral"?NOT:MET):UNK;
  const bilateral=f=>f.side?(f.side==="bilateral"?MET:NOT):UNK;
  const q=f=>f.quality||{};
  const pulsating=f=>q(f).answered?tri(!!q(f).pulsating):UNK;
  const pressing=f=>q(f).answered?tri(!!q(f).pressing):UNK;
  const a=f=>f.assoc||{};
  const nausea=f=>tri(a(f).nausea),vomiting=f=>tri(a(f).vomiting),photo=f=>tri(a(f).photo),phono=f=>tri(a(f).phono);
  const assocEv=f=>a(f).answered?["悪心 "+SYM[nausea(f)],"嘔吐 "+SYM[vomiting(f)],"光過敏 "+SYM[photo(f)],"音過敏 "+SYM[phono(f)]].join("・"):"随伴症状 未回答";
  /* 結果のまとめ：core＝E を除いた criterion。E は常に unknown（医師確認） */
  function summarize(code,name,criteria,notes){
    const core=criteria.filter(c=>!c.always);
    const overall=and(...core.map(c=>c.status));
    const coreIds=core.map(c=>c.id).join("");
    const range=coreIds.length>1?`${coreIds[0]}–${coreIds[coreIds.length-1]}`:coreIds;
    let text;
    if(overall===MET)text=`Criteria ${range}：充足 → ICHD-3 ${code} に合致する特徴あり。最終診断には二次性頭痛等の除外が必要`;
    else if(overall===NOT){const nm=core.filter(c=>c.status===NOT);
      text=`基準未充足：`+nm.map(c=>`${c.id}（${c.ev||c.label}）`).join("／");}
    else{const uk=core.filter(c=>c.status===UNK);
      text=`評価不能：`+uk.map(c=>`${c.id}（${c.ev||c.label}）`).join("／")+" が不明";}
    return {code,name,criteria,overall,text,notes:notes||[]};
  }
  const E=(id)=>({id:id||"E",label:"ほかの ICHD-3 診断でうまく説明されない",status:UNK,ev:"医師による確認が必要",always:true});

  /* ---- 1.1 Migraine without aura ---- */
  function moParts(f){
    const B=inRange(f.continuous?{min:Infinity,max:Infinity}:f.durMin,240,4320);
    const C1=unilateral(f),C2=pulsating(f),C3=f.nrs==null?UNK:tri(f.nrs>=4),
      C4=f.activity==null?UNK:tri(f.activity);
    const C=atLeast(2,[C1,C2,C3,C4]);
    const D=or(or(nausea(f),vomiting(f)),and(photo(f),phono(f)));
    return {B,C1,C2,C3,C4,C,D};
  }
  function evaluateMigraineWithoutAura(f){
    const p=moParts(f);const cnt=[p.C1,p.C2,p.C3,p.C4].filter(x=>x===MET).length;
    return summarize("1.1","Migraine without aura",[
      crit("A","5回以上の発作",ge(f.attacks,5),lab(f.attacks,"回数 未回答")),
      crit("B","持続 4–72時間（未治療または治療無効時）",p.B,f.continuous?"ずっと続いている":lab(f.durMin,"持続 未回答")),
      crit("C","4項目中2項目以上",p.C,`${cnt}/4（片側性 ${SYM[p.C1]}・拍動性 ${SYM[p.C2]}・中等度以上 ${SYM[p.C3]}・日常動作で増悪 ${SYM[p.C4]}）`),
      crit("D","悪心/嘔吐、または光過敏と音過敏",p.D,assocEv(f)),
      E()]);
  }

  /* ---- 1.2 Migraine with aura ---- */
  function maParts(f){const au=f.aura||{};
    const present=au.answered?tri((au.types||[]).length>0):UNK;
    const B=and(present,tri(au.reversible));
    const types=au.types||[];
    const C1=tri(au.spread),C2=types.length>=2?tri(au.succession):(types.length===1?NOT:UNK),
      C3=inRange(au.dur,5,60),C4=tri(au.unilateral),
      C5=types.length?tri(types.some(t=>["visualPositive","sensory"].includes(t))):UNK,
      C6=tri(au.headache60);
    const C=atLeast(3,[C1,C2,C3,C4,C5,C6]);
    return {present,B,C,C1,C2,C3,C4,C5,C6,types};
  }
  const AURA_JA={visualPositive:"キラキラ・ギザギザ",visualNegative:"視野の一部が欠ける",sensory:"しびれ・チクチク",
    speech:"言葉が出にくい",motor:"脱力",brainstem:"めまい・複視",retinal:"片目だけ見えにくい"};
  function evaluateMigraineWithAura(f){const au=f.aura||{},p=maParts(f);
    if(p.present===NOT)return summarize("1.2","Migraine with aura",[crit("B","前兆がある",NOT,"前兆の症状なし")]);
    const cnt=[p.C1,p.C2,p.C3,p.C4,p.C5,p.C6].filter(x=>x===MET).length;
    const notes=[];
    /* 典型的前兆（1.2.1）から外れる点：ICHD-3 はとくに TIA などの除外を求めている */
    const odd=[];
    if(au.firstOver40===true)odd.push("初回が40歳以降");
    if(p.types.length&&p.C5===NOT)odd.push("陰性症状のみ");
    if(au.dur&&au.dur.max<=5)odd.push("5分未満");
    if(au.dur&&au.dur.min>=60)odd.push("60分を超える");
    if(au.reversible===false)odd.push("完全には元に戻らない");
    const nonTypical=p.types.filter(t=>["motor","brainstem","retinal"].includes(t)).map(t=>AURA_JA[t]);
    if(nonTypical.length)notes.push(`典型的前兆（1.2.1）に含まれない症状あり：${nonTypical.join("・")}（運動・脳幹・網膜の症状は別に評価）`);
    if(odd.length)notes.push(`⚠ Typical aura として非典型的（${odd.join("・")}）。TIA 等を含め医師確認`);
    return summarize("1.2","Migraine with aura",[
      crit("A","2回以上の発作",tri(au.n2),au.n2===true?"2回以上":au.n2===false?"1回だけ":"前兆の回数 未回答"),
      crit("B","完全可逆性の前兆（視覚・感覚・言語・運動・脳幹・網膜）",p.B,
        (p.types.map(t=>AURA_JA[t]).join("・")||"前兆 未回答")+(au.reversible===true?"・完全に戻る":au.reversible===false?"・戻らないことがある":"・可逆性 未回答")),
      crit("C","6項目中3項目以上",p.C,`${cnt}/6（5分以上で拡大 ${SYM[p.C1]}・順に出現 ${SYM[p.C2]}・各5–60分 ${SYM[p.C3]}・片側性 ${SYM[p.C4]}・陽性症状 ${SYM[p.C5]}・60分以内に頭痛 ${SYM[p.C6]}）`),
      E("D")],notes);
  }

  /* ---- 1.3 Chronic migraine ---- */
  function evaluateChronicMigraine(f){
    const mo=moParts(f),ma=maParts(f);
    const A=and(ge(f.days,15),tri(f.over3m));
    const pheno=or(and(mo.B,mo.C,mo.D),and(ma.B,ma.C));
    const B=and(ge(f.attacks,5),pheno);
    const C=and(tri(f.cmDays8),or(and(mo.C,mo.D),and(ma.B,ma.C)));
    return summarize("1.3","Chronic migraine",[
      crit("A","頭痛が月15日以上・3か月を超える",A,`頭痛 ${lab(f.days,"日数 未回答")}・3か月超 ${SYM[tri(f.over3m)]}`),
      crit("B","1.1 B–D または 1.2 B–C を満たす発作が5回以上",B,`回数 ${lab(f.attacks,"未回答")}・1.1 B–D または 1.2 B–C の特徴 ${SYM[pheno]}`),
      crit("C","月8日以上が 1.1 C・D または 1.2 B・C を満たす",C,f.cmDays8===true?"強い頭痛の日 月8日以上":f.cmDays8===false?"強い頭痛の日 月8日未満":"月8日以上か 未回答"),
      E("D")]);
  }

  /* ---- 2 Tension-type headache（頻度で 2.1 / 2.2 / 2.3 を選ぶ）---- */
  function evaluateTensionTypeHeadache(f){
    const chronic=ge(f.days,15);
    const C=atLeast(2,[bilateral(f),and(pressing(f),neg(pulsating(f))),f.nrs==null?UNK:tri(f.nrs<=6),f.activity==null?UNK:tri(!f.activity)]);
    const cEv=`両側性 ${SYM[bilateral(f)]}・圧迫/締めつけ（非拍動性） ${SYM[and(pressing(f),neg(pulsating(f)))]}・軽度〜中等度 ${SYM[f.nrs==null?UNK:tri(f.nrs<=6)]}・動作で増悪しない ${SYM[f.activity==null?UNK:tri(!f.activity)]}`;
    if(chronic===MET){
      const B=f.continuous?MET:(f.durMin?(f.durMin.min>=60?MET:(f.durMin.max<=60?NOT:UNK)):UNK);
      const D=and(atMostOne([photo(f),phono(f),nausea(f)]),neg(vomiting(f)));
      return summarize("2.3","Chronic tension-type headache",[
        crit("A","月15日以上・3か月を超える",and(chronic,tri(f.over3m)),`頭痛 ${lab(f.days)}・3か月超 ${SYM[tri(f.over3m)]}`),
        crit("B","数時間〜数日、または絶え間なく続く",B,f.continuous?"ずっと続いている":lab(f.durMin,"持続 未回答")),
        crit("C","4項目中2項目以上",C,cEv),
        crit("D","光過敏・音過敏・軽い悪心のうち1つまで、中等度以上の悪心・嘔吐なし",D,assocEv(f)+(a(f).nausea===true?"（悪心の程度は未聴取）":"")),
        E()],[]);
    }
    const sub=f.days?(f.days.max<=1?"2.1":(f.days.min>=1?"2.2":"2.1/2.2")):"2.1/2.2";
    const name=sub==="2.1"?"Infrequent episodic tension-type headache":sub==="2.2"?"Frequent episodic tension-type headache":"Episodic tension-type headache";
    const D=and(neg(or(nausea(f),vomiting(f))),atMostOne([photo(f),phono(f)]));
    return summarize(sub,name,[
      crit("A","10回以上の発作",ge(f.attacks,10),lab(f.attacks,"回数 未回答")+(f.days?`・${f.days.label}`:"")),
      crit("B","持続 30分〜7日",inRange(f.continuous?{min:Infinity,max:Infinity}:f.durMin,30,10080),f.continuous?"ずっと続いている":lab(f.durMin,"持続 未回答")),
      crit("C","4項目中2項目以上",C,cEv),
      crit("D","悪心・嘔吐なし、光過敏・音過敏は1つまで",D,assocEv(f)),
      E()]);
  }

  /* ---- 3.1 Cluster headache ---- */
  function evaluateClusterHeadache(f){const t=f.tac||{};
    const locOT=f.regions?tri(f.regions.some(r=>["orbital","frontal","temporal"].includes(r))):UNK;
    const severe=f.nrs==null?UNK:tri(f.nrs>=7);
    const sideLocked=f.side?(["right","left"].includes(f.side)?MET:(f.side==="bilateral"?NOT:UNK)):UNK;
    /* 直接の問（いつも片側の目のまわり〜こめかみの強い痛み）を優先。「いいえ」なのにほかの回答がそろうときは食い違い＝? */
    const comp=and(severe,sideLocked,locOT);
    const where=t.screen===true?MET:(t.screen===false?(comp===MET?UNK:NOT):comp);
    const whereEv=t.screen===true?"片側の目のまわり〜こめかみの強い痛み：はい":
      (t.screen===false?(t.asked?"片側の目のまわり〜こめかみの強い痛み：いいえ"+(comp===MET?`（ほかの回答と食い違い：${nrsEv(f)}・${sideEv(f)}）`:""):sideEv(f)):
      `問は未回答（${nrsEv(f)}・${sideEv(f)}）`);
    const B=and(where,inRange(f.continuous?{min:Infinity,max:Infinity}:f.durMin,15,180));
    const C=or(tri(t.autonomic),tri(t.restless));
    const D=inRange(t.freq,0.5,8);
    return summarize("3.1","Cluster headache",[
      crit("A","5回以上の発作",ge(f.attacks,5),lab(f.attacks,"回数 未回答")),
      crit("B","重度・片側の眼窩/眼窩上/側頭部、15–180分",B,
        `${whereEv}・持続 ${f.continuous?"ずっと続いている":lab(f.durMin,"未回答")}`),
      crit("C","同側の自律神経症状、または落ち着きのなさ",C,
        (t.labels&&t.labels.length?t.labels.join("・"):(t.screen===true?"自律神経症状 未回答":"未聴取"))),
      crit("D","頻度 2日に1回〜1日8回",D,lab(t.freq,t.screen===true?"頻度 未回答":"未聴取")),
      E()]);
  }

  /* ---- 8.2 Medication-overuse headache ----
     薬の種類で基準日数が違う：単純鎮痛薬（アセトアミノフェン・NSAIDs）は月15日以上、
     トリプタン・エルゴタミン・オピオイド・複合鎮痛薬・その他は月10日以上。
     1種類ずつは基準未満でも、複数の合計が月10日以上なら 8.2.7。 */
  const MED_CLASS={ac:{ja:"アセトアミノフェン",t:15},ns:{ja:"NSAIDs",t:15},otc:{ja:"市販の複合鎮痛薬",t:10},
    tr:{ja:"トリプタン",t:10},er:{ja:"エルゴタミン",t:10},op:{ja:"オピオイド",t:10},ot:{ja:"その他の急性期治療薬",t:10}};
  function mohOveruse(m){
    if(!m||!m.answered)return {status:UNK,ev:"頭痛薬 未回答"};
    const used=Object.keys(m.classes||{}).filter(k=>MED_CLASS[k]);
    if(!used.length)return {status:NOT,ev:"頭痛薬なし"};
    const per=used.map(k=>({k,s:ge(m.classes[k].days,MED_CLASS[k].t),r:m.classes[k].days}));
    let multi=NOT;
    if(used.length>=2){const rs=per.map(p=>p.r);
      if(rs.some(r=>!r))multi=UNK;
      else{const lo=Math.max(...rs.map(r=>r.min)),hi=rs.reduce((s,r)=>s+(r.max===Infinity?31:r.max-1),0);
        multi=lo>=10?MET:(hi<10?NOT:UNK);}}
    const status=or(...per.map(p=>p.s),multi);
    const ev=per.map(p=>`${MED_CLASS[p.k].ja} ${p.r?p.r.label:"日数 未回答"}（基準 月${MED_CLASS[p.k].t}日以上）`).join("・")+
      (used.length>=2?`・合計 ${multi===MET?"月10日以上":multi===NOT?"月10日未満":"不明"}`:"");
    return {status,ev};
  }
  function evaluateMedicationOveruseHeadache(f){
    const o=mohOveruse(f.meds);
    const A=and(ge(f.days,15),tri(f.preexisting));
    const B=and(o.status,o.status===NOT?NOT:tri((f.meds||{}).over3m));
    return summarize("8.2","Medication-overuse headache",[
      crit("A","もともと頭痛がある人で、頭痛が月15日以上",A,`頭痛 ${lab(f.days,"日数 未回答")}・以前から ${SYM[tri(f.preexisting)]}`),
      crit("B","急性期治療薬の定期的な過剰使用が3か月を超える",B,o.ev+(o.status!==NOT?`・3か月超 ${SYM[tri((f.meds||{}).over3m)]}`:"")),
      E("C")]);
  }

  /* ---- 4.10 New daily persistent headache ---- */
  function evaluateNDPH(f){const n=f.ndph||{};
    const A=tri(n.persistent);
    const B=and(tri(n.remembered),tri(n.within24h));
    const C=or(tri(f.over3m),tri(n.over3mOnset));
    return summarize("4.10","New daily persistent headache",[
      crit("A","持続する頭痛（B・C を満たす）",A,n.persistent===true?"ずっと続いている":n.persistent===false?`ずっと続く頭痛ではない（${f.days?f.days.label:(f.durMin?"1回 "+f.durMin.label:"回答から")}）`:"続き方 未回答"),
      crit("B","はっきり覚えている始まりから24時間以内に絶え間ない頭痛になった",B,
        `始まった日を覚えている ${SYM[tri(n.remembered)]}・24時間以内に毎日 ${SYM[tri(n.within24h)]}`),
      crit("C","3か月を超えて続く",C,n.onsetLabel?`いつ頃から：${n.onsetLabel}`:"期間 未回答"),
      E("D")]);
  }

  /* ---- 二次性頭痛の Red flag（ICHD の一次性頭痛の評価より常に先に出す）----
     urgent＝患者画面で「受付スタッフに見せてください」を出す項目（ユーザー決定 H2）。 */
  const RF_TEXT={
    thunderclap:"急に始まり1分以内に最大強度",peakUnder1:"最大になるまで1分未満",worst:"経験したことがないほど強い",
    different:"これまでの頭痛と明らかに違う",newOnset:"新規発症",progressive:"悪化が続いている",fever:"発熱を伴う",
    consciousness:"意識の異常・けいれん",paresis:"手足の脱力（まひ）",numbness:"手足のしびれ",speech:"言葉が出にくい",
    diplopia:"複視",orthostatic:"立位で増悪・臥位で軽快",valsalva:"咳・くしゃみ・いきみで誘発/増悪",exertion:"運動で誘発/増悪",
    pregnancy:"妊娠中・授乳中（産後）",immuno:"がん・免疫低下・免疫抑制治療",trauma:"頭部外傷のあとから",eye:"目の強い痛み・充血"};
  const URGENT=["thunderclap","peakUnder1","consciousness","paresis","speech"];
  function evaluateHeadacheRedFlags(f){const r=(f&&f.redFlags)||{};
    return Object.keys(RF_TEXT).filter(k=>r[k]).map(k=>({id:k,text:RF_TEXT[k]+(typeof r[k]==="string"?`（${r[k]}）`:""),urgent:URGENT.includes(k)}));
  }

  function evaluateAll(f){
    return {version:"ICHD-3 (2018)",redFlags:evaluateHeadacheRedFlags(f),entities:[
      evaluateMigraineWithoutAura(f),evaluateMigraineWithAura(f),evaluateChronicMigraine(f),
      evaluateTensionTypeHeadache(f),evaluateClusterHeadache(f),evaluateMedicationOveruseHeadache(f),evaluateNDPH(f)]};
  }
  return {MET,NOT,UNK,SYM,URGENT,MED_CLASS,
    evaluateAll,evaluateHeadacheRedFlags,evaluateMigraineWithoutAura,evaluateMigraineWithAura,evaluateChronicMigraine,
    evaluateTensionTypeHeadache,evaluateClusterHeadache,evaluateMedicationOveruseHeadache,evaluateNDPH,
    mohOveruseStatus:m=>mohOveruse(m).status,
    _:{and,or,neg,atLeast,atMostOne,inRange,ge}};
})();
</script>
<script>
/* ===== 状態（画面内メモリのみ・保存しない） ===== */
const D = { who:null, ageBand:null, symptoms:[], mods:[], primary:null, firstSx:null, common:{},
            m:{1:{},2:{},3:{},4:{},5:{},6:{}},
            assoc:{}, func:[], collateral:[], vis:{}, sx:{},
            bg:{risk:[],medChange:null,medText:"",drugKinds:[],family:null,famPheno:[],famRel:[],
                immune:[],lifestyle:[],history:"",prevDx:"",prevDxNone:false,
                autonomic:[],dopaDrug:null,preInfection:null,pregnancy:null},
            visited:[], tests:"", free:"",
            /* コンサルトモード（医療者用）の入力。患者向けの項目とは混ぜない。
               モードそのものは D に持たない（下の MODE 変数）＝引き継ぎQRで
               患者側の端末にモードが移ってしまわないようにするため。 */
            consult:{from:{dept:null,doctor:"",place:null},ask:[],askOther:"",when:null,
              sx:{sel:[],main:null},since:null,onset:null,course:null,dist:null,adl:null,
              exam:{},examNote:{},drugs:"",drugChange:null,history:"",tests:[],testNote:"",memo:""} };
/* ============================================================================
   ▼▼▼ ここから【設定ブロック】：質問文と選択肢はすべてこの範囲にあります ▼▼▼
   文言の調整はここだけを見ればできます。中身の一覧：
     ONSET_OPTS(発症時期) / SEV_OPTS(つらさ) / TREND_OPTS(その後の変化)
     EVENT_TAGS(悪くなった時の出来事) / AGES(年代) / VISITED(受診した科)
     WHO(入力者) / SYMPTOMS(気になる症状) / COMMON(始まりの速さ・続き方・左右差)
     ASSOC_GROUPS(一緒に出ている症状) / ASSOC_PLAN(主訴ごとに優先して聞く同時症状)
     FUNC(生活への影響) / QM(症候別モジュール①〜⑥) / BG_*(背景) / OPT_*(その他の単発の選択肢)
     HA_*(頭痛の選択肢。判定用の範囲と識別子つき) / ICHD_SUPPORT(医療者シートの ICHD-3 criteria support を出すか)
     QMETA(質問ごとの目的・分類。表示には使わない)
   ※ ICHD-3 の判定そのものは設定ブロックではなく、上の <script id="ichd3-engine"> にある（改訂時はそこだけ差し替える）。

   ★編集するときの注意★
   ・選択肢の文言を変えると、その回答を使っている判定
     （syndromePatterns / redFlags / unconfirmedItems / buildSummaryParts / SHOW_IF）も
     あわせて直す必要があります。文言が判定の目印を兼ねているためです。
   ・どの質問を誰に出すかは、設定ブロックの直後の SHOW_IF に1か所で書いてあります。
     「念のため全員に聞く」質問は足さないでください（2026-09-11 方針）。
   ・引き継ぎQRは選択肢の「並び順」を番号として使っています。順番を入れ替えたり
     途中に項目を足すと古いQRと意味がずれますが、SCHEMA_SIG が自動で変化して
     古いQRは「読み込めません」と安全に弾かれるので、番号の付け替えは不要です。
   ============================================================================ */
/* 症状ごとの経過（時系列グラフ用）：発症時期バケット・程度・変化の向き */
const ONSET_OPTS=[["今日",0.03],["数日前",0.15],["1〜2週間前",0.4],["1か月前",1],
  ["2〜3か月前",2.5],["半年前",6],["1年前",12],["2年以上前",30],["わからない",null]];
const SEV_OPTS=["軽い","中くらい","重い"];
/* その後の変化は「向き」だけを聞く。出たり消えたり（波・発作）は COMMON の pattern で聞く（重複をなくした） */
const TREND_OPTS=["強くなっている","段階的に強くなった","変わらない","軽くなってきた","わからない"];
/* 1か月以内に始まった症状（症状ごとに始まりの速さを聞く対象） */
const RECENT_BUCKETS=["今日","数日前","1〜2週間前","1か月前"];
/* 悪くなった時の「できごと」の目印（病名・診断には触れない、機能的な出来事のみ） */
const EVENT_TAGS=["転倒した","杖・歩行器を使い始めた","車椅子になった","入院した","急に強くなった","動けなくなった","一人でできなくなった","その他"];
/* 症状ごとの色分け（カテゴリカル配色・固定順。色だけに頼らず凡例とラベルを併用） */
const SYMPTOM_COLORS=["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#4a3aa7","#e34948"];
function symptomColor(s){const i=D.symptoms.indexOf(s);return (i>=0&&i<SYMPTOM_COLORS.length)?SYMPTOM_COLORS[i]:"#898781";}
function eventMonths(e){const f=ONSET_OPTS.find(x=>x[0]===e.bucket);return f?f[1]:null;}
let EVUI={}; /* 出来事フォームの一時状態（画面内メモリのみ・保存しない） */
function sxMonths(s){const o=D.sx[s]&&D.sx[s].onset;const f=ONSET_OPTS.find(x=>x[0]===o);return f?f[1]:null;}
/* 今回の受診理由（急に悪くなった時期）の月数。グラフに目印を出す */
function visitMonths(){const f=ONSET_OPTS.find(x=>x[0]===D.common.visitBucket);return f?f[1]:null;}
function setVisit(o){D.common.visitBucket=(D.common.visitBucket===o?null:o);render();}
/* 最も古い症状の発症ラベル（全体の発症時期として利用） */
function overallOnset(){let best=null,lab=null;D.symptoms.forEach(s=>{const m=sxMonths(s);if(m!=null&&(best==null||m>best)){best=m;lab=D.sx[s].onset;}});return lab;}
const AGES = ["〜39","40代","50代","60代","70代","80代","90歳〜","答えない"];
const VISITED = ["かかりつけ医","脳神経外科","眼科","整形外科","耳鼻科","リハビリ","救急","未受診"];

/* ===== データ保存（任意・研究/改善用） =====
   SAVE_ENDPOINT に保存先URL（Google Apps Script など）を入れると、
   利用者が同意した場合のみ完了時に送信します。空のままなら保存機能はオフ。 */
const SAVE_ENDPOINT = ""; // ←ここに公開したWebアプリのURLを貼る（※設定したら<head>のCSPのconnect-srcにもこのURLのオリジンを追加すること）
/* ★デプロイのたびに必ず更新すること★
   ブラウザのキャッシュで古い版が表示されていても気づけるように、
   画面と医療者シートに版数を出し、下の checkForUpdate() で自動確認する。 */
const APP_VERSION = "2026-09-11e";

const SESSION = { id:"NBG-"+nowStr().slice(2).replace(/-/g,"")+"-"+Math.floor(1000+Math.random()*9000), start:Date.now() };
let _saved=false;
/* 保存対象は「選択式の回答」のみ。自由記述（free/tests/medText/trouble/編集後文）は送信しない */
/* 送信してよい項目だけを通す。「自由記述は入れないよう気をつける」ではなく、
   自由記述に使うキー名を機械的に落とす形で担保する（項目を足したときの取りこぼし防止）。

/* 近い方／先の方を「やりにくい動作」から導く（判定・シートは従来どおり prox を読む） */
function deriveProx(){const m=D.m[2]=D.m[2]||{};const a=m.acts||[];
  const p=a.some(x=>ACTS_PROX.includes(x)),d=a.some(x=>ACTS_DIST.includes(x));

/* 人体図の選択（bodyparts）から area のラベルを作る。引き継ぎのあとも同じ関数で作り直す */
function areaFromParts(){const m=D.m[2]=D.m[2]||{};const a=m.bodyparts||[];
  const labs=BODY_REGIONS.filter(r=>a.includes(r.id)).map(r=>r.label);
  if(["handL","handR","footL","footR"].every(x=>a.includes(x)))labs.push(AREA_GLOVE);

/* 薬の行（まとめ・シート共通）。薬の名前はお薬手帳で分かるので、症状の前後の変更を先に書く */
function medLine(){const b=D.bg,p=[];
  if(b.medChange==="ある")p.push("症状の前後に始めた・やめた・変えた薬あり");
  else if(b.medChange==="ない")p.push("症状の前後の薬の変更なし");

function unconfirmedItems(){
  const out=assocConflicts().map(assocConflictText);const A=assocAnswers();const miss=n=>!A[n]||A[n]==="u"||A[n]==="conflict";
  const c=D.common,m1=D.m[1]||{},m2=D.m[2]||{},m3=D.m[3]||{},m4=D.m[4]||{},m5=D.m[5]||{},m6=D.m[6]||{};
  const bulbarMiss=miss("飲み込みにくさ・むせ")||miss("ろれつが回りにくい")||miss("息苦しさ");
  /* 症候ごとの項目を先に入れる（最大5件なので、主訴に固有のものを優先） */
  const eyeBulbar=(hasMod(3)||D.symptoms.includes("ものが二重に見える")||D.symptoms.includes("まぶたが下がる"))&&bulbarMiss;
  if(eyeBulbar)out.push("飲み込みにくさ・ろれつ・息苦しさの有無");
  if(hasMod(1)){const r=[];
    if(fell()&&!m1.falldir)r.push("転び方");
    if(!m1.aid)r.push("歩行の段階（杖・歩行器など）");
    if(showQ("bg.autonomic")&&!(D.bg.autonomic||[]).length)r.push("尿のトラブル");
    if(r.length)out.push(r.join("・"));}
  if(hasMod(2)){const r=[];
    if(!(m2.area||[]).length)r.push("症状のある場所");
    if(!(m2.acts||[]).length)r.push("やりにくい動作（近い方か先の方か）");
    if(!m2.spread)r.push("広がり方");
    if(showQ("common.side")&&!c.side)r.push("左右差");
    if(bulbarMiss&&!eyeBulbar)r.push("飲み込み/ろれつ/息苦しさ");
    if(r.length)out.push(r.join("・"));}
  if(showQ("common.diurnal")&&(!c.diurnal||c.diurnal==="わからない"))
    out.push("症状の朝夕の変動・疲れによる悪化の有無");
  if(hasMod(4)){const r=[];
    if(!m4.feel||m4.feel==="わからない")r.push("感じ方（回る・ふわふわ・気が遠くなる）");
    if(!m4.dur)r.push("1回の持続");
    if(!(m4.trig||[]).length)r.push("きっかけ（頭の向き・立ち上がり）");
    if(!m4.ear)r.push("耳の症状");
    if(r.length)out.push("めまいの"+r.join("・"));}
  if(hasMod(5)){const r=[];
    if(!m5.count)r.push("これまでの回数");
    if(showQ("m5.days")&&(!m5.days||m5.days==="わからない"))r.push("月の頭痛日数");
    if(!m5.dur||m5.dur==="わからない")r.push("1回の持続（薬なし）");
    if(!(m5.with||[]).length)r.push("吐き気・光・音の有無");
    if(!(m5.meds||[]).length)r.push("頭痛薬と使う日数");
    if(r.length)out.push("頭痛の"+r.slice(0,3).join("・"));}
  if(hasMod(6)&&(!m6.when||m6.when==="わからない"))
    out.push("ふるえが安静時に強いか、動作・姿勢で強いか");
  if(showQ("common.freq")&&(!c.freq||!c.episodeDur))
    out.push("症状が出る頻度・1回の持続時間・きっかけ");
  if(A["物忘れ・性格や行動の変化"]==="y")
    out.push("物忘れ・行動の変化について、いつ頃からか・日常生活への影響");
  if(A["視力が落ちた・目が痛い"]==="y")
    out.push("見え方の症状について、片目か両目か・いつからか");
  /* 始まりの速さごとに、次に確認する価値が高いこと（回答済みのものは出さない） */
  if(c.tempo==="数秒〜数分で")
    out.push("症状が始まったときの状況（何をしていたか）と、そのあとの経過");
  if(tempoIs("sub")&&!(D.bg.immune||[]).length)
    out.push("発熱・体重減少・がんや免疫の治療の有無");
  if(tempoIs("chronic")){
    if(firstSxCandidates().length>1&&!D.firstSx)out.push("症状が出た順番");
    if(!D.bg.family)out.push("家族に似た症状の人がいるか");
  }
  /* 同じことを聞く「以前にも」に答えていれば出さない（2026-09-11 修正） */
  if(showQ("common.relapse")&&D.symptoms.length>=3&&!c.relapse)
    out.push("以前にも似た症状が出て自然に良くなったこと（出たり治ったり）の有無");
  if(!c.tempo) out.push("始まりの速さ（数分・数時間・数日・数週・数か月・年単位）");
  if(!overallOnset()&&!c.onsetMonth&&!c.onsetDate)
    out.push("それぞれの症状がいつから始まったか（おおよその時期・順序）");
  /* 仕様§5: 提示は最大5件（症候特異的ルールを優先。配列前方＝症候別が先に入る構成） */
  return out.slice(0,5);
}

function drawStepper(){

   <div class="qhead" style="margin-top:22px"><span class="qnum">2</span><span class="qtext">${isProxy()?"ご本人の気になる症状を選んでください":"気になる症状を選んでください"}</span>${spkBtn("気になる症状を選んでください。いくつでも選べます")}</div>
   <div class="hint">病名がわからなくて大丈夫。いくつでも選べます。</div>
   <div class="opts grid">${items}</div>
   ${showQ("symptoms.primary")?qhead("3","いちばん困っている症状はどれですか？","ひとつ選んでください。この症状を中心にお聞きします")+
     `<div class="opts grid">${D.symptoms.map(x=>opt(D.primary===x,esc(x),`setPrimary('${x.replace(/'/g,"")}')`)).join("")}</div>`:""}
   ${D.mods.length?`<div class="note">📋 選んだ内容に合わせて質問します：<b>${D.mods.map(i=>MODS_PT[i]).join("、")}</b></div>`:''}`);}
function setPrimary(x){D.primary=(D.primary===x?null:x);render();}

function scrCommon(){
  const p=primarySym(),many=D.symptoms.length>1;
  const T=COMMON.find(x=>x.k==="tempo"),P=COMMON.find(x=>x.k==="pattern"),S=COMMON.find(x=>x.k==="side");
  const row=(k,o)=>opt(D.common[k]===o,o,`setCommon('${k}','${o.replace(/'/g,"")}')`);
  let h=proxyBanner()+`<p class="lead">🕒 <b>始まり方</b>を教えてください${p&&many?`（いちばん困っている「${esc(p)}」について）`:""}</p>`;
  h+=qhead(1,p?`「${esc(p)}」は、${T.q}`:T.q,T.sub)+`<div class="opts grid">${T.o.map(o=>row("tempo",o)).join("")}</div>`;
  h+=qhead(2,P.q)+`<div class="opts grid">${P.o.map(o=>row("pattern",o)).join("")}</div>`;
  if(showQ("common.diurnal")){const F=COMMON.find(x=>x.k==="diurnal");
    h+=qhead("＋",F.q,F.sub)+`<div class="opts grid">${F.o.map(o=>row("diurnal",o)).join("")}</div>`;}
  if(showQ("common.freq")){
    h+=qhead("＋","どれくらいの頻度で起きますか？")+`<div class="opts grid">${OPT_FREQ.map(o=>row("freq",o)).join("")}</div>`;
    h+=qhead("＋","1回の症状は、どれくらい続きますか？")+`<div class="opts grid">${OPT_EPISODE_DUR.map(o=>row("episodeDur",o)).join("")}</div>`;
  }
  if(showQ("common.side"))h+=qhead(3,S.q,S.sub)+`<div class="opts grid">${S.o.map(o=>row("side",o)).join("")}</div>`;
  if(showQ("common.hand"))h+=qhead("手","利き手はどちらですか？","任意。左右の症状を読み取るのに役立ちます")+
    `<div class="opts grid">${OPT_HAND.map(a=>opt(D.hand===a,a,`setHand('${a}')`)).join("")}</div>`;
  if(showQ("common.relapse")){
    /* 再発・寛解（過去に出て自然に治ったエピソード）。発作のように出たり消えたりする人には聞かない */
    h+=qhead("＋","以前にも同じような症状が出て、自然に治まったことはありますか？","「出て、治って、また出た」があるかは、とても大切な手がかりです");
    h+=`<div class="opts grid">${OPT_RELAPSE.map(o=>row("relapse",o)).join("")}</div>`;
    if(showQ("common.relapseRecover")){
      h+=`<div class="hint" style="margin:6px 0 2px">前回はどれくらいで治まりましたか？（任意）</div>`;
      h+=`<div class="opts grid">${OPT_RELAPSE_RECOVER.map(o=>row("relapseRecover",o)).join("")}</div>`;
    }
  }
  return card(h);}

/* 日付ブロック：だいたいの年月 と 正確な日付 のどちらでも入力可 */

function setDate(k,v){if(v)D.common[k]=v;else delete D.common[k];render();}
function clearDate(key){delete D.common[key+"Month"];delete D.common[key+"Date"];render();}
/* 入力された日付を読みやすい日本語にする（正確な日付＞年月の順で優先） */
function fmtWhen(key){const dd=D.common[key+"Date"],md=D.common[key+"Month"];
  if(dd){const[y,m,d]=dd.split("-");return `${y}年${+m}月${+d}日`;}
  if(md){const[y,m]=md.split("-");return `${y}年${+m}月ごろ`;}

function bodyMapSVG(){
  const sel=(D.m[2]&&D.m[2].bodyparts)||[];
  const el=BODY_REGIONS.map(r=>r.shape.replace(/^<(\w+)/,`<$1 class="reg ${sel.includes(r.id)?"sel":""}" onclick="toggleBody('${r.id}')"`)).join("");
  const chosen=sel.length?BODY_REGIONS.filter(r=>sel.includes(r.id)).map(r=>r.label).join("・"):"まだ選ばれていません";
  return `<div class="bodywrap">
    <svg class="bodysvg" viewBox="16 0 168 320" width="210" height="400" xmlns="http://www.w3.org/2000/svg">
      <text x="24" y="14" class="rlab">← 右</text><text x="150" y="14" class="rlab">左 →</text>${el}</svg>
    <div class="bodyleg"><b>症状のある場所</b>をタップしてください（複数可・もう一度で解除）
      <div style="color:var(--brand-d);font-weight:700;margin:6px 0">選択：${chosen}</div>
      <span class="mini">手先・足先の丸は「手袋・くつ下のように先の方」を表します。</span></div></div>`;
}
function toggleBody(id){

const MOD_LEAD={1:"歩き方と転倒について",2:"どこが・何ができなくなったか",3:"目・まぶたの様子",4:"めまいの様子",5:"頭痛の様子",6:"ふるえの様子"};
function scrModule(){
  const id=D.mods[modCursor],np=modPageCount(id),pg=Math.min(MOD_PAGE,np-1);
  let h=proxyBanner()+`<div style="display:inline-block;background:var(--brand-l);color:var(--brand-d);font-weight:800;
    border-radius:20px;padding:5px 14px;font-size:calc(14px*var(--fs))">📍 ${MODS_PT[id]}　(${modCursor+1}/${D.mods.length})</div>
    <p class="lead" style="margin-top:8px">${MOD_LEAD[id]||"くわしく"}を教えてください${np>1?`<br><b style="color:var(--brand-d)">${pg+1} / ${np}</b>　${(MOD_PAGE_TITLE[id]||[])[pg]||""}`:""}</p>`;
  let prevCat=null,n=0;
  QM[id].forEach(it=>{
    if((it.pg||0)!==pg)return;
    if(!modQShown(id,it))return;
    if(it.cat&&it.cat!==prevCat){h+=`<div class="grouplab">${it.cat}</div>`;prevCat=it.cat;}
    h+=qhead(++n,it.q,it.sub);
    if(id===2&&it.k==="area"){
      h+=bodyMapSVG();
    }else if(it.ui==="nrs"){
      /* 0〜10 は1段（スマホは2〜3段）の数字ボタン。fitOptGrids は触らない */
      h+=`<div class="opts grid nrs">`+it.o.map(o=>opt(D.m[id][it.k]===o,o,`setM(${id},'${it.k}','${o}')`)).join("")+`</div>`;
    }else if(it.multi){
      h+=`<div class="opts grid">`+it.o.map(o=>{const arr=D.m[id][it.k]||[];
        return opt(arr.includes(o),o,`toggleMulti(${id},'${it.k}','${o.replace(/'/g,"")}')`,true);}).join("")+`</div>`;
    }else{
      h+=`<div class="opts grid">`+it.o.map(o=>opt(D.m[id][it.k]===o,o,
        `setM(${id},'${it.k}','${o.replace(/'/g,"")}')`)).join("")+`</div>`;
    }
    if(id===5){
      /* 受付への声かけは、Red flag の問（とその次の「いちばん強くなるまで」）のすぐ下に出す */
      if((it.k==="peak"||(it.k==="rf"&&!showQ("m5.peak")))&&haStaffAlert())h+=staffAlertHtml();
      if(it.k==="meds"&&haMedClasses().length)
        h+=`<textarea id="hamed" style="min-height:56px;margin-top:8px" placeholder="薬の名前がわかれば（任意）　例：ロキソニン、イブ" oninput="D.m[5].medName=this.value">${esc(HAM().medName||"")}</textarea>`;
    }
  });
  return card(h);}

/* 任意の画面（一緒に出ている症状・生活への影響・背景）は、先頭で「とばす」を選べるようにする。
   スマホでは「次へ」が内容の最後にあるので、答えない人が最後までスクロールしなくて済む（2026-09-11c）。
   「直す」から来たとき（RETC）は、とばすと別の画面へ進んでしまうのでボタンは出さない。 */
function skipBar(){
  const btn=RETC?"":`<button type="button" class="skiplink no-print" onclick="next()">この画面をとばす →</button>`;
  return `<div class="skipbar"><span><b>任意</b>の画面です</span>${btn}</div>`;}
/* 主訴のまとまりを ASSOC_PLAN のキーに変換する（始まりの速さで分かれるものがある） */
function assocPlanKey(s){
  const acute=tempoIs("acute")&&!isEpisodic(),sub=tempoIs("sub");
  if(acute&&["力が入らない","しびれる・感覚が鈍い","ろれつが回らない","ものが二重に見える","めまい・ふらつき"].includes(s))return "focalAcute";
  if(sub&&["力が入らない","しびれる・感覚が鈍い","手足がやせる・ぴくつく"].includes(s))return "nmSub";
  if(s==="力が入らない"||s==="手足がやせる・ぴくつく")return "weakChronic";
  if(s==="しびれる・感覚が鈍い")return "numbChronic";
  if(s==="歩きにくい"||s==="転びやすい")return "gait";
  if(["ものが二重に見える","まぶたが下がる","飲み込みにくい・むせる","ろれつが回らない"].includes(s))return "bulbar";
  if(s==="めまい・ふらつき")return "dizzy";
  if(s==="家族から見て動き・表情が変わった")return "move";
  if(s==="手足がふるえる")return "tremor";
  if(s==="頭が痛い")return "headache";
  return "generic";
}
/* 優先して聞く項目（pri）と、畳んでおく残り（rest）。
   症状の選択などから反映済みの項目は、訂正できるよう pri に見せるが、上限（未回答8項目）には数えない。 */
const ASSOC_PRI_MAX=8;
function assocPlan(){
  const p=primarySym(),order=[p,...D.symptoms.filter(x=>x!==p)].filter(Boolean);
  const want=[];order.forEach(x=>(ASSOC_PLAN[assocPlanKey(x)]||[]).forEach(nm=>{if(!want.includes(nm))want.push(nm);}));
  ASSOC.forEach(nm=>{if(hasLinkedAnswer(nm)&&!want.includes(nm))want.push(nm);});
  const pri=[];let open=0;
  want.forEach(nm=>{if(hasLinkedAnswer(nm)){pri.push(nm);return;}if(open<ASSOC_PRI_MAX){pri.push(nm);open++;}});
  return {pri:pri,rest:ASSOC.filter(nm=>!pri.includes(nm))};
}
/* いま画面に出ている項目（まとめて「いいえ」は、見えている項目にしか効かせない） */
function assocVisible(){const p=assocPlan();return (UI.assocMore||!p.pri.length)?ASSOC.slice():p.pri.slice();}
function assocRow(nm){
  const v=assocValue(nm),linked=linkedSymptoms(nm);
  const pend=ASSOC_EDIT&&ASSOC_EDIT.nm===nm?ASSOC_EDIT.value:null;
  const cls=(val,on)=>`${v===val?on:""}${pend===val?" pend":""}`;
  let h=`<div class="tri"><span class="nm">${nm}${hasLinkedAnswer(nm)&&v==="y"?`<small class="answer-source">${linked.length?"症状の選択":"ほかの回答"}から反映済み</small>`:""}${isBulkNo(nm)?`<small class="answer-source">まとめて「いいえ」</small>`:""}</span><span class="grp" role="group" aria-label="${nm}">
        <button type="button" aria-pressed="${v==='y'}" class="${cls('y','on-y')}" onclick="setTri('${nm}','y')">はい</button>
        <button type="button" aria-pressed="${v==='n'}" class="${cls('n','on-n')}" onclick="setTri('${nm}','n')">いいえ</button>
        <button type="button" aria-pressed="${v==='u'}" class="${cls('u','on-u')}" onclick="setTri('${nm}','u')">わからない</button></span></div>`;
  /* 確認・訂正の吹き出しは、必ずタップした行の直下に出す（下にまとめると押せたか分からない） */
  if(v==="conflict")h+=`<div class="answer-conflict">${esc(assocConflictText(nm))}。上の選択肢で回答を確認してください。</div>`;
  if(pend)h+=`<div class="answer-conflict" role="status"><b>「${esc(nm)}」を「${pend==="n"?"いいえ":"わからない"}」にしますか？</b><br>「${esc([...linkedSymptoms(nm),...otherLinkedAnswers(nm)].join("／"))}」の選択も外れます。
        <div class="answer-actions"><button type="button" class="fixbtn" onclick="confirmAssocEdit()">はい、訂正する</button><button type="button" class="fixbtn" onclick="ASSOC_EDIT=null;render()">やめる</button></div></div>`;
  return h;
}
function scrAssoc(){
  const plan=assocPlan(),all=UI.assocMore||!plan.pri.length;
  /* 急に始まった人には「始まったときに同時に起きたこと」として聞く（局在の手がかり） */
  const title=(tempoIs("acute")&&!isEpisodic())?"症状が始まったとき、同時に起きたことはありますか？":"一緒に出ている症状はありますか？";
  let h=proxyBanner()+skipBar()+`<div class="qhead"><span class="qnum">➕</span><span class="qtext">${title}</span>${spkBtn(title+"わかる範囲で、はい・いいえ・わからない、から選んでください")}</div>
    <div class="hint">選んだ症状に合わせて、確かめたい項目だけを並べています。最初に選んだ同じ症状は「はい」に反映済みです。ボタンを押さないかぎり、未回答が「なし」になることはありません。</div>`;
  /* 気づいていない項目をまとめて「いいえ」にする導線。見えている項目だけが対象（畳んだ項目は未確認のまま） */
  {const t=assocBulkTargets().length,b=ASSOC.filter(isBulkNo).length;
   if(t)h+=`<div style="margin:6px 0 10px"><button type="button" onclick="assocAllNo()" style="width:100%;padding:12px;border:1.5px solid var(--brand);background:var(--brand-l);color:var(--brand-d);border-radius:12px;font-weight:800;font-size:calc(15px*var(--fs));cursor:pointer;font-family:inherit">気づいていない${t}項目を、まとめて「いいえ」にする</button>
     <div class="mini" style="margin-top:4px">そのあと、当てはまるものだけ「はい」に変えてください。こちらが早いです。すでに反映済みの項目は変わりません。</div></div>`;
   if(b)h+=`<div class="mini" style="margin:0 0 10px">まとめて「いいえ」にした${b}項目があります。<button type="button" class="fixbtn" onclick="assocUndoBulk()">まとめた回答をもどす</button></div>`;}
  if(plan.pri.length)h+=`<div class="triwrap">${plan.pri.map(assocRow).join("")}</div>`;
  if(plan.rest.length){
    if(!all){
      h+=`<div style="text-align:center;margin:14px 0 4px"><button type="button" class="no-print" onclick="toggleUI('assocMore')" style="border:1.5px solid var(--brand);background:#fff;color:var(--brand-d);border-radius:30px;padding:10px 20px;font-size:calc(14px*var(--fs));font-weight:800;cursor:pointer;font-family:inherit">＋ ほかの症状も確認する（任意・${plan.rest.length}項目）</button></div>`;
    }else{
      h+=`<div class="note" style="background:#f5f9fd;border-color:var(--line);color:var(--sub);margin-top:14px">ここから下は任意です。気になるものがあれば答えてください。</div>`;
      ASSOC_GROUPS.forEach(grp=>{const items=grp.items.filter(nm=>plan.rest.includes(nm));if(!items.length)return;
        h+=`<div class="grouplab">${grp.g}</div><div class="triwrap">${items.map(assocRow).join("")}</div>`;});
      if(plan.pri.length)h+=`<div style="text-align:center;margin:10px 0 4px"><button type="button" class="no-print" onclick="toggleUI('assocMore')" style="border:1.5px solid var(--brand);background:var(--brand-l);color:var(--brand-d);border-radius:30px;padding:10px 20px;font-size:calc(14px*var(--fs));font-weight:800;cursor:pointer;font-family:inherit">▲ とじる</button></div>`;
    }
  }
  return card(h);}

/* === 症状ごとの経過（時系列）：選んだ症状それぞれの「いつから・程度・変化」 === */
let SX_OPEN=null;   /* いま開いている症状。null なら「最初の未入力」を自動で開く */
function sxDone(s){const r=D.sx[s]||{};
  return !!(r.onset&&r.sev&&r.trend&&(!showQ("sx.tempo",s)||r.tempo));}
function firstOpenSx(){return D.symptoms.find(x=>!sxDone(x))||D.symptoms[0]||null;}
function toggleSxOpen(s){SX_OPEN=(SX_OPEN===s?"__none__":s);render();}
function sxSummaryLine(s){const r=D.sx[s]||{};
  const parts=[r.onset,r.sev&&("つらさ"+r.sev),r.trend,r.tempo&&("始まり："+r.tempo)].filter(Boolean);
  return parts.length?parts.join(" / "):"まだ入力していません";}
function noteBanner(){return RESTORE_NOTE?`<div class="note" style="background:var(--brand-l);border-color:var(--brand);color:var(--brand-d)">🔁 ${RESTORE_NOTE}</div>`:"";}
function scrSxtime(){
  let h=proxyBanner()+noteBanner()+`<div class="qhead"><span class="qnum">🕒</span><span class="qtext">選んだ症状は、それぞれいつ頃からですか？</span>${spkBtn("選んだ症状は、それぞれいつ頃からですか？だいたいで大丈夫です")}</div>
   <div class="hint">答えた時期と出来事がグラフになります。だいたいで大丈夫です。同じ時期の症状の順番は決めつけません。</div>`;
  const openSx=(SX_OPEN==="__none__")?null:(SX_OPEN||firstOpenSx());
  if(D.symptoms.length>1){
    const done=D.symptoms.filter(sxDone).length;
    h+=`<div class="mini" style="margin:8px 0 2px">症状ごとに入力します（${done} / ${D.symptoms.length} 件おわり）。答え終わった症状は1行にたたまれます。</div>`;
  }
  D.symptoms.forEach(s=>{
    const r=D.sx[s]||{},col=symptomColor(s),esq=s.replace(/'/g,"");
    if(s!==openSx){
      /* たたんだ状態：1行の要約＋タップで開く */
      h+=`<button type="button" onclick="toggleSxOpen('${esq}')" style="width:100%;text-align:left;display:flex;align-items:center;gap:10px;
        border:1px solid var(--line);border-left:5px solid ${col};border-radius:12px;padding:12px 14px;margin:8px 0;background:#fff;cursor:pointer;font-family:inherit;min-height:52px">
        <span style="flex:0 0 auto;font-size:16px">${sxDone(s)?"✓":"…"}</span>
        <span style="flex:1 1 auto;min-width:0">
          <span style="display:block;font-weight:800;color:var(--brand-d);font-size:calc(15px*var(--fs))">${esc(s)}</span>
          <span style="display:block;color:var(--sub);font-size:calc(13px*var(--fs))">${esc(sxSummaryLine(s))}</span>
        </span>
        <span style="flex:0 0 auto;color:var(--brand-d);font-weight:800">${sxDone(s)?"直す":"入力する"} ▸</span></button>`;
      return;
    }
    h+=`<div class="qunit" style="border:1px solid var(--line);border-left:5px solid ${col};border-radius:14px;margin:12px 0;background:#fcfdff">
      <div style="font-weight:800;color:var(--brand-d);margin-bottom:6px">${esc(s)}</div>
      <div class="hint" style="margin:2px 0 4px">いつ頃から</div>
      <div class="opts grid">`+ONSET_OPTS.map(([o])=>opt(r.onset===o,o,`setSx('${esq}','onset','${o.replace(/'/g,"")}')`)).join("")+`</div>
      <div class="hint" style="margin:8px 0 4px">今のつらさ${prevOf(s)&&prevOf(s).sev?`<span style="color:var(--brand-d);font-weight:700">（前回は「${esc(prevOf(s).sev)}」）</span>`:""}</div>
      <div class="opts grid">`+SEV_OPTS.map(o=>opt(r.sev===o,o,`setSx('${esq}','sev','${o}')`)).join("")+`</div>
      <div class="hint" style="margin:8px 0 4px">その後の変化</div>
      <div class="opts grid">`+TREND_OPTS.map(o=>opt(r.trend===o,o,`setSx('${esq}','trend','${o.replace(/'/g,"")}')`)).join("")+`</div>
      ${showQ("sx.tempo",s)?`<div class="hint" style="margin:8px 0 4px">どれくらいの速さで始まりましたか（今の強さになるまで）</div>
      <div class="opts grid">`+commonOpts("tempo").map(o=>opt(r.tempo===o,o,`setSx('${esq}','tempo','${o}')`)).join("")+`</div>`:""}
      ${eventBlock(s)}
    </div>`;
  });
  if(showQ("sxtime.firstSx")){const cand=firstSxCandidates();
    h+=qhead("⏱","同じ頃に始まった症状のうち、最初に気づいたのはどれですか？","（任意）わからなければ飛ばしてください");
    h+=`<div class="opts grid">`+cand.map(x=>opt(D.firstSx===x,esc(x),`setFirstSx('${x.replace(/'/g,"")}')`)).join("")+`</div>`;}
  h+=qhead("📣","今回、受診しようと思うほど悪くなったのはいつ頃ですか？","（任意）グラフに目印を付けます");
  h+=`<div class="opts grid">`+ONSET_OPTS.filter(o=>o[0]!=="わからない").map(([o])=>opt(D.common.visitBucket===o,o,`setVisit('${o.replace(/'/g,"")}')`)).join("")+`</div>`;
  h+=`<div class="hint" style="margin-top:6px">📅 最初の症状の正確な日付がわかれば（任意）</div>`;
  h+=dateBlock("onset","最初に何か症状が出た時期");
  h+=trajectoryChart();
  return card(h);}
function setFirstSx(x){D.firstSx=(D.firstSx===x?null:x);render();}
function setSx(s,k,v){D.sx[s]=D.sx[s]||{};D.sx[s][k]=(D.sx[s][k]===v?null:v);
  /* 3つ答え終わったら次の未入力へ自動で送る（送り忘れを防ぐ） */
  if(sxDone(s)&&(SX_OPEN===s||SX_OPEN===null)){const nx=D.symptoms.find(x=>!sxDone(x));SX_OPEN=nx||"__none__";}
  render();}

/* できごと（悪くなった時期の目印）：症状ごとに複数追加できる。病名・診断には触れない */

      <div class="hint" style="margin:0 0 4px">いつ頃</div>
      <div class="opts grid">`+ONSET_OPTS.filter(o=>o[0]!=="わからない").map(([o])=>opt(ui.bucket===o,o,`setEvBucket('${s.replace(/'/g,"")}','${o.replace(/'/g,"")}')`)).join("")+`</div>
      <div class="hint" style="margin:8px 0 4px">どんな出来事</div>
      <div class="opts grid">`+EVENT_TAGS.map(o=>opt(ui.tag===o,o,`setEvTag('${s.replace(/'/g,"")}','${o.replace(/'/g,"")}')`)).join("")+`</div>`+
      (ui.tag==="その他"?`<textarea placeholder="どんな出来事か、短く教えてください" oninput="setEvNote('${s.replace(/'/g,"")}',this.value)">${esc(ui.note||"")}</textarea>`:``)+
      `<div style="text-align:right;margin-top:8px;display:flex;gap:8px;justify-content:flex-end">
        <button type="button" onclick="toggleEvUI('${s.replace(/'/g,"")}')" style="font-size:calc(13px*var(--fs));padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;color:var(--sub)">キャンセル</button>
        <button type="button" onclick="addEvent('${s.replace(/'/g,"")}')" ${(!ui.bucket||!ui.tag)?"disabled":""} style="font-size:calc(13px*var(--fs));padding:8px 14px;border:none;background:var(--brand);color:#fff;border-radius:9px;cursor:pointer;font-weight:700">＋ 追加する</button>
      </div></div>`;
  }else{
    h+=`<button type="button" onclick="toggleEvUI('${s.replace(/'/g,"")}')" style="font-size:calc(13px*var(--fs));padding:8px 14px;min-height:44px;border:1.5px dashed var(--line);background:#fff;border-radius:9px;cursor:pointer;color:var(--brand-d);font-weight:700">＋ 出来事を追加</button>`;

function toggleEvUI(s){EVUI[s]=EVUI[s]||{};EVUI[s].open=!EVUI[s].open;render();}
function setEvBucket(s,b){EVUI[s]=EVUI[s]||{};EVUI[s].bucket=(EVUI[s].bucket===b?null:b);render();}
function setEvTag(s,t){EVUI[s]=EVUI[s]||{};EVUI[s].tag=(EVUI[s].tag===t?null:t);render();}
function setEvNote(s,v){EVUI[s]=EVUI[s]||{};EVUI[s].note=v;}
function addEvent(s){const u=EVUI[s];if(!u||!u.bucket||!u.tag)return;
  D.sx[s]=D.sx[s]||{};D.sx[s].events=D.sx[s].events||[];
  D.sx[s].events.push({bucket:u.bucket,tag:u.tag,note:u.tag==="その他"?(u.note||""):""});
  EVUI[s]={open:false};render();}
function removeEvent(s,i){if(D.sx[s]&&D.sx[s].events)D.sx[s].events.splice(i,1);render();}

/* 病歴は入力された時期と出来事だけを描く。過去のつらさを自動生成しない。
   旧QRのwaveは読み込み互換性のため保持するが、記録としては表示しない。 */
function tickLabel(m){
  if(m<0.02)return "今";
  if(m<0.9)return `${Math.max(1,Math.round(m*30))}日前`;
  if(m<12)return `${Math.round(m)}か月前`;
  return Number.isInteger(m/12)?`${m/12}年前`:`${Math.round(m)}か月前`;
}
function historyMonths(bucket){
  /* 「2年以上前」は2年前の境界に左向きの印を置き、30か月前に固定しない。 */
  return bucket==="2年以上前"?24:(ONSET_OPTS.find(o=>o[0]===bucket)||[])[1];
}
function onsetGroups(){
  const groups=[];
  D.symptoms.forEach(s=>{
    const bucket=(D.sx[s]||{}).onset;
    const known=historyMonths(bucket)!=null;
    const label=known?bucket:(bucket==="わからない"?"時期不明（わからない）":"時期未回答");
    let g=groups.find(g=>g.label===label);
    if(!g){g={label,m:known?historyMonths(bucket):null,symptoms:[]};groups.push(g);}
    g.symptoms.push(s);
  });
  return groups.sort((a,b)=>(b.m==null?-1:b.m)-(a.m==null?-1:a.m));
}
/* 症状名の中に「・」が入るため（例「飲み込みにくい・むせる」）、
   症状どうしの区切りは「、」、時期のまとまりの区切りは「／」に分けている。 */
function onsetSummary(){
  return onsetGroups().map(g=>`${g.symptoms.join("、")}：${g.label}`+
    (g.symptoms.length>1?tieNote(g):"")).join(" ／ ");
}
/* 同じ区分の症状の前後関係。最初に気づいた症状を答えていればそれだけ書き、ほかは決めつけない */
function tieNote(g){
  if(D.firstSx&&g.symptoms.includes(D.firstSx))
    return g.symptoms.length>2?`（最初に気づいたのは${D.firstSx}、ほかの前後関係は未確認）`:`（最初に気づいたのは${D.firstSx}）`;
  return "（前後関係は未確認）";
}
/* 出来事の短い呼び方。図の中に長い語は入らないが、番号や凡例に逃がすと視線が往復するので略語にする */
const EVENT_SHORT={"転倒した":"転倒","杖・歩行器を使い始めた":"杖","車椅子になった":"車椅子","入院した":"入院",
  "急に強くなった":"増悪","動けなくなった":"動けず","一人でできなくなった":"介助","その他":"他"};

/* 1症状＝1行。発症●・出来事◆を同じ軸に並べ、発症から現在までを線でつなぐ。
   （以前は出来事ごとに行を足していたため、日付6個で医療者シートの55%を使っていた）
   線が表すのは「いつから続いているか」だけで、強さの推移は描かない。 */
/* 経過グラフは、症状が複数か、出来事の目印があるときだけ意味がある（2026-09-11e）。
   1症状・出来事なしのときは、①の「症状ごとの経過」の1行で足りる。 */
function showTrajectory(){return (D.symptoms||[]).length>1||(D.symptoms||[]).some(s=>(((D.sx||{})[s]||{}).events||[]).length>0);}
function trajectoryChart(){
  if(!D.symptoms.length)return "";
  const rows=[];
  onsetGroups().forEach(g=>g.symptoms.forEach(s=>{
    const r=D.sx[s]||{};
    rows.push({name:s,bucket:r.onset,col:symptomColor(s),kind:"onset",
      state:[r.sev?"つらさ"+r.sev:"",r.trend||""].filter(Boolean).join("・")||"程度・変化は未回答",
      events:[...(r.events||[])].sort((a,b)=>(historyMonths(b.bucket)||0)-(historyMonths(a.bucket)||0))});
  }));
  if(D.common.visitBucket)rows.push({name:"受診のきっかけとなった悪化",bucket:D.common.visitBucket,
    col:"var(--warn)",kind:"visit",state:"",events:[]});
  const known=[];
  rows.forEach(r=>{const m=historyMonths(r.bucket);if(m!=null)known.push(m);
    r.events.forEach(e=>{const em=historyMonths(e.bucket);if(em!=null)known.push(em);});});
  const maxM=Math.max(...known,0.4),pos=m=>8+(1-m/maxM)*84;
  const leftLabel=maxM===24&&known.includes(24)?"2年前以前":tickLabel(maxM);
  const ticks=[{p:8,t:leftLabel,edge:"start"},{p:pos(maxM/2),t:tickLabel(maxM/2),edge:"middle"},{p:92,t:"今",edge:"end"}];
  const axis=known.length?`<div class="history-axis"><span>症状</span><div class="history-axis-track">${ticks.map(t=>`<span class="${t.edge}" style="left:${t.p}%">${t.t}</span>`).join("")}</div></div>`:
    `<p class="history-caption">時期の回答が入ると、時間軸に表示されます。</p>`;
  const body=rows.map(r=>{
    const m=historyMonths(r.bucket),unknown=m==null;
    const label=unknown?(r.bucket==="わからない"?"時期不明":"時期未回答"):r.bucket;
    const p=unknown?50:pos(m),align=p<25?"start":p>75?"end":"middle";
    const mark=r.bucket==="2年以上前"?"←":r.kind==="onset"?"●":"▼";
    let marks="";
    if(unknown){
      marks=`<span class="history-unknown">${label}</span>`;
    }else{
      /* 発症から現在まで、続いている期間を1本の線で示す（強さは表さない） */
      if(r.kind==="onset")marks+=`<span class="history-dur" style="left:${p.toFixed(3)}%;right:8%;--history-color:${r.col}"></span>`;
      marks+=`<span class="history-mark ${align}" style="left:${p.toFixed(3)}%;--history-color:${r.col}">`+
        `<span class="history-symbol" aria-hidden="true">${mark}</span><span>${esc(label)}</span></span>`;
      r.events.forEach((e,i)=>{
        const em=historyMonths(e.bucket);if(em==null)return;
        const ep=pos(em),ea=ep<25?"start":ep>75?"end":"middle";
        const tag=EVENT_SHORT[e.tag]||e.tag;
        marks+=`<span class="history-mark ev ${ea}" title="${esc(e.tag)}${e.note?"（"+esc(e.note)+"）":""}：${esc(e.bucket)}"
          style="left:${ep.toFixed(3)}%;--history-color:${r.col};--ev-top:${i%2?"var(--ev-lo2)":"var(--ev-lo)"}">`+
          `<span class="history-symbol" aria-hidden="true">◆</span><span>${esc(tag)}</span></span>`;
      });
    }
    return `<div class="history-row ${r.kind}">
      <div class="history-name"><b>${esc(r.name)}</b>${r.state?`<div class="history-answer">${esc(r.state)}</div>`:""}</div>
      <div class="history-track">${marks}</div>
    </div>`;
  }).join("");
  const ties=onsetGroups().filter(g=>g.symptoms.length>1);
  const evAll=rows.flatMap(r=>r.events.map(e=>e.tag));
  return `<div class="blk history-chart"><h4>症状の経過（回答した時期・出来事）</h4>
    ${axis}${body}
    <p class="history-caption">● 発症 ／ ◆ 出来事${evAll.length?"（"+uniqArr(rows.flatMap(r=>r.events.map(e=>(EVENT_SHORT[e.tag]||e.tag)+"＝"+e.tag))).join("、")+"）":""} ／ ▼ 受診のきっかけ。線は発症から現在まで続いていることを示します（強さの推移ではありません）。
    ${ties.length?"<br>"+ties.map(g=>`${esc(g.label)}の${esc(g.symptoms.join("、"))}：${esc(tieNote(g).replace(/[（）]/g,""))}。`).join(""):""}
    ${rows.some(r=>r.bucket==="2年以上前")?"<br>← は2年以上前（上限なし）です。":""}</p>
  </div>`;
}
function uniqArr(a){return [...new Set(a)];}

/* 症状ごとの発症・程度・変化（医療者シート用の簡易表） */
function sxOnsetTable(){
  const rows=D.symptoms.filter(s=>D.sx[s]&&(D.sx[s].onset||D.sx[s].sev||D.sx[s].trend));
  if(!rows.length)return "";
  return `<div class="assoc" style="margin:2px 0 6px">`+rows.map(s=>{const r=D.sx[s];
    const evs=(r.events||[]).map(e=>`${esc(e.bucket)}${esc(e.tag)}${e.note?`(${esc(e.note)})`:""}`).join("、");
    return `<div><span class="g">${s}:</span> ${[r.onset,r.sev&&"つらさ"+r.sev,r.trend,evs&&("出来事:"+evs)].filter(Boolean).join(" / ")}</div>`;}).join("")+`</div>`;}

/* まだ埋まっていない項目＝神経内科医が最初に取るべきもの。
   「何が分かっているか」より「何が残っているか」を先に見せるのが時間短縮に直結する。 */
function consultMissing(){
  const C=D.consult,m=[];
  if(!C.ask.length)m.push("答えてほしいこと（コンサルトの問い）");
  if(!C.sx.main)m.push("主症候");
  if(!C.since)m.push("発症時期");
  if(!C.onset)m.push("発症様式（急性・亜急性・慢性・発作性・変動性）");
  if(!C.course)m.push("その後の経過（進行性・階段状・再発寛解など）");
  if(!C.dist)m.push("分布・左右差");
  if(!C.adl)m.push("いまの歩行・ADL");
  const nd=CONSULT_EXAM_CORE.filter(it=>cExamVal(it.id)==="nd").map(it=>it.n);
  if(nd.length)m.push("神経所見（未実施）："+nd.join("・"));
  if(!C.drugs&&!C.drugChange)m.push("内服・薬剤の変更");
  if(!D.symptoms.length)m.push("患者・家族からの病歴（「患者・家族に渡す」のQRで埋まります）");
  return m;
}

  return C.ask.map(id=>{const x=CONSULT_ASK.find(a=>a[0]===id);if(!x)return "";

function opt(sel,label,onclick,multi){
  /* 長い選択肢は2列に押し込むと数文字ずつ折り返されて読めなくなるので、

  const wide=plain.length>=8?" wideopt":"";

function toggleSym(nm){

    if(i<0){if(!arr.includes(v))arr.push(v);}else{const j=arr.indexOf(v);if(j>=0)arr.splice(j,1);}}

}
/* 「あてはまらない」「ケガはない」「見た人はいない」は、ほかの選択と同時に選べない */
const EXCLUSIVE_OPTS=["あてはまらない","ケガはない","見た人はいない","特にない","ない","使っていない"];
function toggleIn(arr,o){const i=arr.indexOf(o);
  if(i>=0){arr.splice(i,1);return false;}
  if(EXCLUSIVE_OPTS.includes(o))arr.length=0;
  else for(let j=arr.length-1;j>=0;j--)if(EXCLUSIVE_OPTS.includes(arr[j]))arr.splice(j,1);
  arr.push(o);return true;}
function toggleMulti(id,k,o){D.m[id]=D.m[id]||{};D.m[id][k]=D.m[id][k]||[];const added=toggleIn(D.m[id][k],o);
  if(added)Object.keys(MODULE_ASSOC).forEach(nm=>{if(MODULE_ASSOC[nm].some(([m,v,kk])=>m===id&&(kk||"main")===k&&v===o)&&D.assoc[nm]!=="y")delete D.assoc[nm];});
