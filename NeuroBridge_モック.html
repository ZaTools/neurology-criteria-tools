/* 2026-09-11c スマホで短い選択肢を2〜3列に並べる。
   実際のフォントで文字幅を測り、1行に収まるときだけ横に並べる（数文字ずつ折り返して読みにくくしない）。
   並び順は変えない（時期・程度など順序のある選択肢が多いため）。相方のいない項目は横幅いっぱいにする。
   広い画面（選択肢の欄が560px以上）では、これまでどおり auto-fit の並びのまま。 */
let _fitCtx=null;
const FIT_PAD=20;   /* 左右の余白6px×2＋枠2px×2＋測定誤差の余裕4px */
function fitOptGrids(){try{
  if(!app||!app.querySelectorAll||!window.getComputedStyle)return;
  if(_fitCtx===null){const c=document.createElement("canvas");_fitCtx=(c&&c.getContext&&c.getContext("2d"))||false;}
  const ctx=_fitCtx;
  app.classList.add("nofx");
  app.querySelectorAll(".opts.grid").forEach(g=>{
    if(g.classList.contains("nrs"))return;
    g.classList.remove("cols1","cols2","cols3");
    const items=[...g.children].filter(x=>x.classList&&x.classList.contains("opt"));
    items.forEach(x=>x.classList.remove("span2"));
    const W=g.clientWidth,n=items.length;
    if(!ctx||!W||W>=560)return;
    if(n<2){g.classList.add("cols1");return;}
    const cs=getComputedStyle(items[0]),fz=parseFloat(cs.fontSize)||17;
    ctx.font=`700 ${fz}px ${cs.fontFamily}`;
    const need=items.map(x=>{const e=x.querySelector(".emo"),et=e?(e.textContent||""):"";
      const t=(x.textContent||"").replace(et,"").trim();
      return ctx.measureText(t).width+(e?fz*1.25+8:0)+FIT_PAD;});
    const cap=k=>(W-(k-1)*(k===3?6:8))/k;   /* 列の間：2列8px・3列6px（CSSと合わせる） */
    if(n>=3&&need.every(w=>w<=cap(3))&&Math.ceil(n/3)<Math.ceil(n/2)){g.classList.add("cols3");return;}
    const fit=need.map(w=>w<=cap(2)),span=[];let paired=0;
    for(let i=0;i<n;){if(fit[i]&&i+1<n&&fit[i+1]){paired+=2;i+=2;}else{span.push(i);i++;}}
    if(paired>=Math.max(2,Math.ceil(n/2))){g.classList.add("cols2");span.forEach(i=>items[i].classList.add("span2"));}
    else g.classList.add("cols1");
  });
  void app.offsetHeight;app.classList.remove("nofx");
}catch(e){try{app.classList.remove("nofx");}catch(_){}}}
let _fitT=0;
window.addEventListener("resize",()=>{clearTimeout(_fitT);_fitT=setTimeout(fitOptGrids,120);});
function applyOneQ(screenChanged){
  if(!ONE_Q)return;
  const qScreens=["who","common","module","bg","assoc","daily","sxtime"];
  if(!qScreens.includes(phase))return;
  const card=[...app.querySelectorAll(".card")].find(c=>c.querySelector(".qhead,.grouplab,.qunit"));
  if(!card)return;
  const kids=[...card.childNodes];const groups=[];let intro=[],cur=null;
  const isStart=n=>n.nodeType===1&&n.classList&&
    (n.classList.contains("qhead")||n.classList.contains("grouplab")||n.classList.contains("qunit"));
  kids.forEach(n=>{
    if(isStart(n)){cur=[n];groups.push(cur);}else if(cur)cur.push(n);else intro.push(n);});
  /* 見出しだけで選択肢を含まないグループは、次のグループに結合（空ステップを作らない） */
  const hasUI=g=>g.some(n=>n.nodeType===1&&n.querySelector&&
    (n.matches(".opts,.triwrap,textarea,.qunit,.bodywrap")||!!n.querySelector(".opt,.tri,textarea,input,.reg")));
  for(let i=0;i<groups.length-1;i++){
    if(!hasUI(groups[i])){groups[i+1]=groups[i].concat(groups[i+1]);groups.splice(i,1);i--;}}
  if(groups.length<2)return;
  if(screenChanged)ONEQ_IDX=0;
  ONEQ_IDX=Math.max(0,Math.min(ONEQ_IDX,groups.length-1));
  card.innerHTML="";
  intro.forEach(n=>card.appendChild(n));
  groups.forEach((g,gi)=>{const w=document.createElement("div");w.className="qstep";
    if(gi!==ONEQ_IDX)w.style.display="none";g.forEach(n=>w.appendChild(n));card.appendChild(w);});
  const nav=document.createElement("div");nav.className="qstepnav no-print";
  nav.innerHTML=`<button ${ONEQ_IDX===0?"disabled":""} onclick="oneQPrev()">◀ 前</button>
    <span>この画面の質問 ${ONEQ_IDX+1} / ${groups.length}</span>
    <button ${ONEQ_IDX===groups.length-1?"disabled":""} onclick="oneQNext()">次 ▶</button>`;
  card.appendChild(nav);
}

/* ===== 状態のURL引き継ぎ（サーバー保存なし・URLに載せる） =====
   QR上限（約2900字）対策として、空値・空配列を落として軽量化する */

let RESTORE_ERR="",RESTORE_NOTE="";
/* ---- 前回受診との比較 ---- */
function prevOf(s){return (D.prev&&D.prev.sx&&D.prev.sx[s])||null;}
function sevDelta(s){
  const p=prevOf(s),c=(D.sx||{})[s];
  if(!p||!c||!p.sev||!c.sev)return null;
  const d=SEV_OPTS.indexOf(c.sev)-SEV_OPTS.indexOf(p.sev);
  return {prev:p.sev,now:c.sev,dir:d>0?"悪化":(d<0?"改善":"変わらず"),mark:d>0?"↑":(d<0?"↓":"→")};

/* 前回からの変化を行の配列で返す（医療者シート・患者向け・プレーンテキストで共用） */
function prevCompareRows(){
  if(!D.prev)return [];
  const rows=[],prevSyms=D.prev.symptoms||[];
  (D.symptoms||[]).forEach(s=>{
    if(prevSyms.indexOf(s)<0){rows.push({s,txt:"今回から出てきた症状",mark:"＋"});return;}
    const d=sevDelta(s);
    rows.push(d?{s,txt:`つらさ ${d.prev} → ${d.now}（${d.dir}）`,mark:d.mark}
                :{s,txt:"前回もあり（つらさの比較はできません）",mark:"→"});
  });
  prevSyms.filter(s=>(D.symptoms||[]).indexOf(s)<0)
    .forEach(s=>rows.push({s,txt:"前回はあったが、今回は選ばれていない",mark:"−"}));
  return rows;

function nextHint(){

/* 診察に呼ばれたら：ここまでの内容でメモを作る（F11 途中出力） */
function drawMidout(){

function canNext(){
  if(phase==="cask")return D.consult.ask.length>0;
  if(phase==="csx")return !!D.consult.sx.main;
  if(phase==="ccourse"||phase==="cexam"||phase==="cdata")return true;
  if(phase==="who")return !!D.who;

  if(isConsult()){

    else if(modCursor<D.mods.length-1){modCursor++;MOD_PAGE=0;}else phase="assoc";}
  else if(phase==="assoc")phase="daily";

function prev(){
  if(isConsult()){

    else if(modCursor>0){modCursor--;MOD_PAGE=modPageCount(D.mods[modCursor])-1;}else phase="common";}
  else if(phase==="assoc"){phase=D.mods.length?"module":"common";modCursor=Math.max(0,D.mods.length-1);
    MOD_PAGE=D.mods.length?modPageCount(D.mods[modCursor])-1:0;}

/* ===== AI整理（モック：中立テンプレート。4軸で要約） =====
   各文に入力元画面(ph)を持たせ、確認画面から「直す」で該当画面へ戻れるようにする */
function buildSummary(){
  if(D.editedSummary!==undefined)return D.editedSummary;
  return buildSummaryParts().map(p=>p.t).join("\n");
}
const PATTERN_TEXT={"ずっと続いている":"ずっと続いている","出たり消えたりする（発作のように・波がある）":"出たり消えたりをくり返している","一度出て、今は治まっている":"一度出て今は治まっている"};
const SHEET_LAB={"m1.what":"歩き方","m1.aid":"歩行の段階","m1.fall":"転倒","m1.falldir":"転び方","m1.fallinj":"転倒によるけが",
  "m2.main":"主な症状","m2.area":"場所","m2.spread":"広がり方","m2.acts":"やりにくい動作","m2.trig":"きっかけ",
  "m3.main":"主な症状","m3.double":"二重の見え方","m3.lid":"まぶた",
  "m4.feel":"めまいの感じ","m4.dur":"1回の持続","m4.freq":"頻度","m4.trig":"きっかけ","m4.ear":"耳の症状",
  "m5.trig":"起こりやすい状況",
  "m6.when":"強いとき","m6.where":"部位","m6.alc":"飲酒で"};
function qlab(id,it){return SHEET_LAB["m"+id+"."+it.k]||it.q.replace(/（.*?）/,"").replace(/？$/,"");}
/* モジュールの回答を「ラベル：値」の配列に（sec 付きの項目は別の見出しに出すので除く） */
function modPairs(id,withSec){const m=D.m[id]||{},out=[];
  QM[id].forEach(it=>{if(!withSec&&it.sec)return;if(!modQShown(id,it))return;let v=m[it.k];
    if(Array.isArray(v))v=v.filter(x=>x!=="あてはまらない").join("・");if(v)out.push([qlab(id,it),v]);});
  return out;}
function buildSummaryParts(){
  pruneHidden();
  const c=D.common;const parts=[];
  /* 時間軸 */
  const onsetExact=fmtWhen("onset");const onsetLab=overallOnset();
  const known=onsetExact||(onsetLab&&onsetLab!=="わからない");
  const onset=onsetExact?`${onsetExact}から`:(known?`${onsetLab}から`:"始まった時期は不明");
  const p=primarySym(),bits=[];
  if(c.tempo&&c.tempo!=="わからない")bits.push(`${D.symptoms.length>1&&p?`「${p}」は`:""}${c.tempo}始まり`);
  if(PATTERN_TEXT[c.pattern])bits.push(PATTERN_TEXT[c.pattern]);
  let lead=bits.length?onset+"、"+bits.join("、"):(known?onset+"症状がある":"始まった時期・始まり方は未回答");
  const fq=c.freq&&c.freq!=="わからない"?`頻度は${c.freq}`:"",du=c.episodeDur&&c.episodeDur!=="わからない"?`1回の持続は${c.episodeDur}`:"";
  if(fq||du)lead+=`（${[fq,du].filter(Boolean).join("、")}）`;
  const course=mainCourse();if(course)lead+=`。現在は${course}`;
  parts.push({t:lead+"。",ph:"common"});
  if(c.diurnal&&c.diurnal!=="わからない")parts.push({t:`疲れ・時間帯による変化：${c.diurnal}。`,ph:"common"});
  /* 再発・寛解 */
  if(c.relapse&&c.relapse!=="わからない"){
    let rl="";
    if(c.relapse==="はじめて")rl="今回がはじめてです。";
    else rl=`過去にも同様の症状が${c.relapse}`+(c.relapseRecover?`（前回は${c.relapseRecover}で良くなった）`:"")+"。";
    parts.push({t:rl,ph:"common"});
  }
  if(c.visitBucket)parts.push({t:`今回、受診しようと思うほど悪くなったのは${c.visitBucket}ごろ。`,ph:"sxtime"});
  /* 症状が出た順序（時系列） */
  if(D.symptoms.length)parts.push({t:"症状が始まった時期は、"+onsetSummary()+"。",ph:"sxtime"});
  const sxTempo=D.symptoms.filter(x=>D.sx[x]&&D.sx[x].tempo).map(x=>`${x}は${D.sx[x].tempo}始まった`);
  if(sxTempo.length)parts.push({t:sxTempo.join("、")+"。",ph:"sxtime"});
  const evtAll=[];D.symptoms.forEach(s=>{((D.sx[s]&&D.sx[s].events)||[]).forEach(e=>evtAll.push(Object.assign({s:s},e,{m:eventMonths(e)})));});
  evtAll.sort((a,b)=>(b.m==null?-1:b.m)-(a.m==null?-1:a.m));
  if(evtAll.length)parts.push({t:"経過の目印："+evtAll.map(e=>`${e.bucket}に${(e.tag==="その他"&&e.note)?e.note:e.tag}（${e.s}）`).join("、")+"。",ph:"sxtime"});
  /* 局在の手がかり（モジュール） */
  D.mods.forEach(id=>{const m=D.m[id]||{};let f="";
    if(id===1){const w=(m.what||[]).join("・");if(w)f+=`歩行に関して${w}。`;
      if(m.aid)f+=`歩き方は「${m.aid}」。`;
      if(m.fall&&m.fall!=="なし")f+=`転倒は${m.fall}（${m.falldir||"方向不明"}）。`;
      const inj=(m.fallinj||[]).filter(x=>x!=="ケガはない");if(inj.length)f+=`転倒による外傷：${inj.join("・")}。`;}
    else if(id===2){const w=(m.main||[]).join("・");const ar=(m.area||[]).join("・");
      if(w)f+=`${w}が${ar?ar+"に":""}ある。`;else if(ar)f+=`症状の場所は${ar}。`;
      if(m.spread&&m.spread!=="わからない")f+=m.spread==="広がっていない"?"広がってはいない。":`${m.spread}広がっている。`;
      const acts=(m.acts||[]).filter(x=>x!=="あてはまらない");if(acts.length)f+=`やりにくい動作：${acts.join("・")}。`;
      const tr=(m.trig||[]).filter(x=>x!=="あてはまらない");if(tr.length)f+=`きっかけ：${tr.join("・")}。`;}
    else if(id===3){const w=(m.main||[]).join("・");if(w)f+=`${w}がある。`;
      if(m.double&&m.double!=="二重ではない")f+=`二重の見え方は${m.double}。`;
      if(m.lid&&m.lid!=="下がらない")f+=`まぶたは${m.lid}。`;}
    else if(id===5){const pr=headacheSheetPairs(true);
      const tr=((m.trig||[]).filter(x=>x!=="特にない"));if(tr.length)pr.push(["起こりやすい状況",tr.join("・")]);
      if(pr.length)f+=`頭痛について、`+pr.map(([k,v])=>`${k}は${v}`).join("、")+"。";}
    else{const pr=modPairs(id,true);if(pr.length)f+=`${MODS_PT[id]}について、`+pr.map(([k,v])=>`${k}は${v}`).join("、")+"。";}
    if(f)parts.push({t:f,ph:"module",mod:id});});
  if(c.side&&!["体の左右は関係ない（めまい・のみこみなど）","わからない"].includes(c.side))parts.push({t:`左右差は${c.side}。`,ph:"common"});
  /* 一緒に出ている症状 */
  assocConflicts().forEach(k=>parts.push({t:assocConflictText(k)+"。",ph:"assoc"}));
  const pos=ASSOC.filter(k=>assocValue(k)==="y");
  if(pos.length)parts.push({t:"一緒に出ている症状："+pos.map(x=>x.replace(/（.*?）/,"")).join("、")+" があります。",ph:"assoc"});
  /* 生活への影響・見た人 */
  if(D.func.length)parts.push({t:"生活面では"+D.func.join("・")+"に支障。",ph:"daily"});
  if((D.collateral||[]).length)parts.push({t:"様子を見た人・動画："+D.collateral.join("・")+"。",ph:"daily"});
  /* 目の症状 */
  if(D.vis.side&&D.vis.side!=="わからない")parts.push({t:"目の症状："+D.vis.side+"。",ph:"sxtime"});
  /* 背景 */
  const bgp=[],b=D.bg;
  if(b.prevDx)bgp.push("ほかの医療機関で言われたこと："+b.prevDx.trim());
  if(b.risk.length)bgp.push(b.risk.join("・"));
  if(medLine())bgp.push(medLine());
  const dk=(b.drugKinds||[]).filter(x=>x!=="あてはまらない");if(dk.length)bgp.push("使っている薬："+dk.join("・"));
  if(b.dopaDrug&&(b.dopaDrug.includes("飲")))bgp.push("動作の遅さ・ふるえに関係しうる薬："+b.dopaDrug);
  if(b.family==="いる")bgp.push("似た症状の家族あり");
  if((b.famPheno||[]).length)bgp.push("家族・血縁："+b.famPheno.join("・")+((b.famRel||[]).length?`（${b.famRel.join("・")}）`:""));
  if(autoPos().length)bgp.push("尿・立ちくらみ・便秘などの症状："+autoPos().join("・"));
  if(b.preInfection&&["あった","ワクチン接種のあとから"].includes(b.preInfection))bgp.push("症状の前の感染・予防接種："+b.preInfection);
  if(b.pregnancy&&["妊娠中","授乳中"].includes(b.pregnancy))bgp.push(b.pregnancy);
  if(b.immune.length)bgp.push(b.immune.join("・"));
  if(b.lifestyle.length)bgp.push(b.lifestyle.join("・"));
  if(b.history)bgp.push("これまでの病気・手術："+b.history.trim());
  if(bgp.length)parts.push({t:"背景："+bgp.join("、")+"。",ph:"bg"});
  if(D.visited.length)parts.push({t:"既受診："+D.visited.join("・")+"。",ph:"bg"});
  if(D.tests)parts.push({t:"受けた検査："+D.tests.trim(),ph:"bg"});
  return parts;
}

/* ③の層2：陽性はすべて出し、重要な陰性と内訳の件数を1〜3行にまとめる（全リストは層3） */
function assocLead(){
  const KEY=["飲み込みにくさ・むせ","ろれつが回りにくい","息苦しさ","筋肉がやせる・ぴくつく"];
  const shortn=x=>x.replace(/（.*?）/,"");
  const pos=ASSOC.filter(k=>assocValue(k)==="y").map(shortn);
  const kpos=KEY.filter(k=>assocValue(k)==="y"),kneg=KEY.filter(k=>assocValue(k)==="n"),kun=KEY.filter(k=>!["y","n"].includes(assocValue(k)));
  const n=v=>ASSOC.filter(k=>assocValue(k)===v).length;
  const conf=assocConflicts().map(assocConflictText);
  return `<div class="assoc">
    <div><span class="g">陽性:</span> ${pos.length?`<span class="y">${pos.join("、")}</span>`:`<span class="u">なし</span>`}</div>
    ${(kneg.length||kun.length)?`<div>${kneg.length?`<span class="g">重要な陰性:</span> <span class="n">${kneg.join("、")}</span>　`:""}${kun.length?`<span class="g">重要な未確認:</span> <span class="u">${kun.join("、")}</span>`:""}</div>`:""}
    ${conf.length?`<div><span class="g">要確認:</span> <span class="u">${conf.map(esc).join("／")}</span></div>`:""}</div>`;
}
function assocCounts(){const n=v=>ASSOC.filter(k=>assocValue(k)===v).length;
  return `陽性${n("y")}・陰性${n("n")+n("nb")}・未確認${ASSOC.length-n("y")-n("n")-n("nb")}`;}
/* 医療者シート③。回答のあった項目だけを行に出し、未確認は件数にまとめて畳む。
   （未確認を全部並べると数が多く、陽性より目立ってしまうため） */
function assocGrouped(){
  const un=[];
  const rows=ASSOC_GROUPS.map(grp=>{
    const shown=[];
    grp.items.forEach(nm=>{const v=assocValue(nm);const s=nm.replace(/（.*?）/,"");
      if(v==="conflict"){shown.push(`<span class="u">${esc(assocConflictText(nm))}</span>`);return;}
      if(v==="y"){shown.push(`<span class="y">${s}＋</span>`);return;}
      if(v==="n"){shown.push(`<span class="n">${s}−${isBulkNo(nm)?"*":""}</span>`);return;}
      un.push(s);});
    return shown.length?`<div><span class="g">${grp.g}:</span> ${shown.join("　")}</div>`:"";
  }).filter(Boolean).join("");
  const bulk=ASSOC.some(isBulkNo)?`<div class="mini">* 未回答分をまとめて「いいえ」と回答した項目</div>`:"";
  const undet=un.length?`<details class="undet"><summary>未確認 ${un.length}項目（開くと一覧）</summary><span class="u">${un.join("、")}</span></details>`:"";
  return (rows||`<span class="u">回答なし</span>`)+bulk+undet;
}
/* 注意サイン（見落とし防止の目印）。
   絶対方針: 病名・局在名・疾患を示唆する語（「〜の疑い」「〜様」等）は出力しない。記述的表現のみ。
   2026-09-11d：頭痛の Red flag（二次性頭痛を考える手がかり）もここに入れる。ICHD-3 の評価より常に先に出す。 */
function redFlags(){
  const c=D.common,A=assocAnswers(),f=assocConflicts().map(assocConflictText);
  if(A["息苦しさ"]==="y")f.push("息苦しさあり");
  if(A["飲み込みにくさ・むせ"]==="y")f.push("飲み込みにくさ・むせあり");
  if(A["ろれつが回りにくい"]==="y")f.push("ろれつの回りにくさあり");
  if(A["筋肉がやせる・ぴくつく"]==="y")f.push("筋肉のやせ・ぴくつきあり");
  if(["数秒〜数分で","数時間で","数日で"].includes(c.tempo))f.push("急な発症（秒〜数日）");

  if(pats.length){
    L.push("◆ 入力から見える症候パターン（所見のまとまり・診断ではありません）");
    pats.forEach(p=>{L.push(`  ・${p.name}`);
      L.push(`      根拠: ${p.ev.join("／")}`);
      L.push(`      確認: ${p.ask}`);});
    L.push("  ※患者・家族の自己申告のみからの機械的な抽出です。診察所見・検査は含みません。");
    L.push("");
  }
  const u=unconfirmedItems();
  L.push("⑧ 次に確認する価値が高い項目（診断には言及しない）");
  L.push(u.length?u.map(x=>"  ・"+x).join("\n"):"  特になし");
  L.push("");
  L.push("⑨ ほかに伝えたいこと（本人・家族の言葉）");
  L.push(`  ${D.free||"（なし）"}`);
  {const ic=ichdPlainLines();if(ic.length){L.push("");ic.forEach(x=>L.push(x));}}
  L.push(sep);
  L.push("本シートは自己申告の整理です。病名・診断・治療方針の判断は医師が行ってください。個人情報は保存していません。");
  return L.join("\n");
}
function copySheet(){
  const txt=isConsult()?plainConsult():plainSheet();const btn=document.getElementById("copyBtn");
  const ok=()=>{if(!btn)return;btn.classList.add("done");btn.textContent="✓ コピーしました";
    setTimeout(()=>{btn.classList.remove("done");btn.textContent="📋 シートをコピー";},2000);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(()=>fallbackCopy(txt,ok));
  }else fallbackCopy(txt,ok);
}
function fallbackCopy(txt,ok){
  const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");ok();}catch(e){alert("コピーできませんでした。手動で選択してください。");}
  document.body.removeChild(ta);
}

/* ===== 端末の「戻る」対応 =====
   画面遷移を履歴に積み、戻るで前の質問画面に戻れるようにする。
   これが無いと、待合室で戻るを1回押しただけでアプリ外に出て入力が全部消える。 */
let HIST_LOCK=false;   /* popstate起点の描画中は積み増さない */
function histState(){return {nbPhase:phase,nbMod:modCursor,nbPage:MOD_PAGE,nbOut:OUT};}
function syncHistory(){
  if(HIST_LOCK)return;
  const s=history.state;
  if(s&&s.nbPhase===phase&&s.nbMod===modCursor&&(s.nbPage||0)===MOD_PAGE)return;   /* 同じ画面内の再描画では積まない */
  try{history.pushState(histState(),"",location.href);}catch(e){}
}
window.addEventListener("popstate",e=>{
  const s=e.state;if(!s||!s.nbPhase)return;
  HIST_LOCK=true;
  phase=s.nbPhase;modCursor=s.nbMod||0;MOD_PAGE=s.nbPage||0;if(s.nbOut)OUT=s.nbOut;
  render();
  HIST_LOCK=false;
});

/* ===== 誤ってページを離れたときの確認 =====
   入力内容は端末にもサーバーにも保存しないので、離脱＝やり直しになる。
   何か入力済みのときだけ確認を出す（意図的なやり直しでは出さない）。 */
let LEAVING=false;
function hasAnyInput(){
  if(D.consult&&(D.consult.ask.length||D.consult.sx.main))return true;
  if(D.symptoms&&D.symptoms.length)return true;
  if(D.who)return true;
  return !!(D.common&&(D.common.trouble||D.common.tempo))||!!D.free;
}
window.addEventListener("beforeunload",e=>{
  if(LEAVING||phase==="intro"||!hasAnyInput())return;
  e.preventDefault();e.returnValue="";
});

/* 自分自身をキャッシュ無効で取り直し、版が違えば再読み込みを促す。
   file:// で開いたときや通信できないときは黙って何もしない（失敗しても実害なし）。 */
function showUpdateBar(){
  if(document.getElementById("updbar"))return;
  const d=document.createElement("div");d.id="updbar";d.className="no-print";
  d.setAttribute("style","position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--brand-d);color:#fff;"+
    "padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:calc(14px*var(--fs))");
  d.innerHTML=`<span>新しい版があります（表示中は古い版です）</span>
    <button type="button" onclick="LEAVING=true;location.reload(true)" style="padding:8px 14px;border:none;border-radius:9px;background:#fff;color:var(--brand-d);font-weight:800;cursor:pointer;font-family:inherit">最新にする</button>`;
  document.body.appendChild(d);
}
function checkForUpdate(){
  try{
    if(location.protocol==="file:")return;
    fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"})
      .then(r=>r.ok?r.text():null)
      .then(t=>{if(!t)return;
        const m=t.match(/APP_VERSION\s*=\s*"([^"]+)"/);
        if(m&&m[1]!==APP_VERSION)showUpdateBar();})
      .catch(()=>{});
  }catch(e){}
}

restoreState().then(()=>{
  try{history.replaceState(histState(),"",location.href);}catch(e){}
  render();
  checkForUpdate();
});
</script>
